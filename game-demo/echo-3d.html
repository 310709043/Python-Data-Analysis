const REVEAL = /* glsl */`
uniform float uTime; uniform vec4 uP[${MAXP}]; uniform vec4 uQ[${MAXP}]; uniform vec3 uPlayer; uniform vec3 uTint; uniform float uTintAmt;

  if (k < 0.5) return vec3(0.45, 0.9, 1.0);   // 0 藍：你的聲音
  if (k < 1.5) return vec3(1.0, 0.72, 0.32);  // 1 金：音核
  if (k < 2.5) return vec3(1.0, 0.28, 0.34);  // 2 紅：守衛
  if (k < 3.5) return vec3(0.7, 0.45, 1.0);   // 3 紫：幽影
  return vec3(1.0, 0.92, 0.86);               // 4 白熱：尖嘯 / 失控尖叫

  vec3 acc = vec3(0.0), mine = vec3(0.0);   // mine = 你自己的藍色聲音（會被章節色調染色）
  for (int i = 0; i < ${MAXP}; i++) {
    float age = uTime - uP[i].w;
    if (age < 0.0 || age > uQ[i].y) continue;
    float r = age * uQ[i].x;
    float d = distance(p, uP[i].xyz);
    float fade = 1.0 - age / uQ[i].y; fade *= fade;
    float ring = exp(-pow((d - r) / 0.3, 2.0));
    float trail = d < r ? exp(-(r - d) * 0.5) * 0.22 : 0.0;
    vec3 v = pulseColor(uQ[i].w) * (ring * 1.5 + trail) * fade * uQ[i].z;

    polygonOffset: mode === 3, polygonOffsetFactor: -1, polygonOffsetUnits: -1,
    fragmentShader: REVEAL + /* glsl */`
      uniform float uBase; uniform float uMode; varying vec3 vW;
      void main() {
        float pat = 1.0; vec3 tint = vec3(1.0);
        if (uMode > 0.5 && uMode < 1.5) {
          vec2 f = abs(fract((vW.xz + 1.0) / 2.0) - 0.5);
          pat = mix(0.06, 1.0, smoothstep(0.46, 0.5, max(f.x, f.y)));
        } else if (uMode > 1.5 && uMode < 2.5) {
          pat = mix(0.15, 1.0, smoothstep(0.85, 1.0, fract(vW.y * 3.0)));
        } else if (uMode > 2.5) {
          float a = abs(fract((vW.x + vW.z) * 1.3) - 0.5);
          float b = abs(fract((vW.x - vW.z * 0.6) * 2.1) - 0.5);
          pat = mix(0.1, 1.0, max(smoothstep(0.44, 0.5, a), smoothstep(0.46, 0.5, b)));
          tint = vec3(1.0, 0.6, 0.65);
        }
        gl_FragColor = vec4(reveal(vW) * uBase * pat * tint, 1.0);

  });
}

// ---------- 關卡靜態場景 ----------
let staticGroup;
function disposeTree(o) { o.traverse(n => { n.geometry?.dispose(); n.material?.dispose?.(); }); }

function loadMap(L) {
  MAP = getMap(L); ROWS = MAP.length; COLS = MAP[0].length;
  openCells = [];
  MAP.forEach((row, r) => [...row].forEach((ch, c) => { if (ch !== '#') openCells.push([c, r]); }));
  CENTER.set((COLS - 1) * S / 2, 0, (ROWS - 1) * S / 2);
  const look = L.ch >= 0 ? CHAPTERS[L.ch] : L;
  U.uTint.value.set(look.tint[0], look.tint[1], look.tint[2]); U.uTintAmt.value = look.tint[3] || 0; U.uBreath.value = look.breath;

  if (staticGroup) { scene.remove(staticGroup); disposeTree(staticGroup); }
  staticGroup = new THREE.Group(); scene.add(staticGroup);

  const box = new THREE.BoxGeometry(S, WALL_H, S), edges = new THREE.EdgesGeometry(box);
  const tile = new THREE.PlaneGeometry(S * 0.96, S * 0.96).rotateX(-Math.PI / 2);
  const walls = [], lines = [], glass = [];
  MAP.forEach((row, r) => [...row].forEach((ch, c) => {
    if (ch === '#') {
      const m = new THREE.Matrix4().makeTranslation(c * S, WALL_H / 2, r * S);
      walls.push(box.clone().applyMatrix4(m)); lines.push(edges.clone().applyMatrix4(m));
    } else if (ch === '~') glass.push(tile.clone().translate(c * S, 0.02, r * S));
  }));
  staticGroup.add(new THREE.Mesh(mergeGeometries(walls), surfaceMat(0.3, 2)));
  staticGroup.add(new THREE.LineSegments(mergeGeometries(lines), surfaceMat(2.2, 0)));
  if (glass.length) staticGroup.add(new THREE.Mesh(mergeGeometries(glass), surfaceMat(1.6, 3)));
  [box, edges, tile].forEach(g => g.dispose());

  const floor = new THREE.PlaneGeometry(COLS * S, ROWS * S, COLS, ROWS).rotateX(-Math.PI / 2);
  floor.translate(CENTER.x, 0, CENTER.z);
  staticGroup.add(new THREE.Mesh(floor, surfaceMat(0.7, 1)));

  // 漂浮塵埃
  const N = COLS * ROWS * 4, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    pos[i * 3] = Math.random() * COLS * S - 1;
    pos[i * 3 + 1] = 0.2 + Math.random() * 2.6;
    pos[i * 3 + 2] = Math.random() * ROWS * S - 1;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  staticGroup.add(new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms: { ...U },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`uniform float uTime; varying vec3 vW;
      void main() {
        vec3 p = position + vec3(sin(uTime * 0.3 + position.z), sin(uTime * 0.5 + position.x) * 0.5, cos(uTime * 0.3 + position.x)) * 0.25;
        vec4 w = modelMatrix * vec4(p, 1.0); vW = w.xyz;
        vec4 mv = viewMatrix * w;
        gl_PointSize = 45.0 / -mv.z;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: REVEAL + /* glsl */`varying vec3 vW;
      void main() { if (length(gl_PointCoord - 0.5) > 0.5) discard; gl_FragColor = vec4(reveal(vW) * 1.6, 1.0); }`,
  })));
}

// ---------- 聲波管理 ----------
let time = 0;
let pulses = [];
function addPulse(p, speed, life, strength, type, y = 0.4, big = false) {
  const q = { x: p.x, y, z: p.z, t0: time, speed, life, strength, type, big };
  pulses.push(q);
  return q;
}
function uploadPulses() {
  pulses = pulses.filter(q => time - q.t0 < q.life);
  // 玩家的回聲永遠優先送進著色器，其他的取最新的
  const big = pulses.filter(q => q.big).slice(-4);
  const rest = pulses.filter(q => !q.big).slice(-(MAXP - big.length));
  const list = [...big, ...rest];
  for (let i = 0; i < MAXP; i++) {
    const q = list[i];
    if (q) { U.uP.value[i].set(q.x, q.y, q.z, q.t0); U.uQ.value[i].set(q.speed, q.life, q.strength, q.type); }
    else U.uP.value[i].w = -999;
  }
}
// 跟著色器同一套公式：某個位置目前被某些顏色的聲波照得多亮
function revealAt(p, types) {
  let s = 0;
  for (const q of pulses) {
    if (!types.includes(q.type)) continue;
    const age = time - q.t0; if (age < 0 || age > q.life) continue;
    const r = age * q.speed, d = Math.hypot(p.x - q.x, p.z - q.z);
    let f = 1 - age / q.life; f *= f;
    s += (Math.exp(-(((d - r) / 0.3) ** 2)) * 1.5 + (d < r ? Math.exp(-(r - d) * 0.5) * 0.22 : 0)) * f * q.strength;
  }
  return Math.min(s, 1.5);
}

// ---------- 音訊系統：音效、配樂、環境音全部即時合成，不需要任何音檔 ----------
//   sfx 音效 ──┐
//   amb 環境音 ─┼─> 壓縮器 ─> 喇叭      （每一路也送進殘響，營造空間感）
//   music 配樂 ─┘   ← 按 M 只會開關這一路
let ac, sfxBus, ambBus, musicBus, reverbSend, noiseBuf, analyser, audioOut;
let musicOn = true;
const MUSIC_VOL = 0.5;   // 配樂整體音量（0~1）
try { musicOn = localStorage.getItem('echo.music') !== 'off'; } catch {}

const midi = n => 440 * 2 ** ((n - 69) / 12);
const pick = a => a[Math.floor(Math.random() * a.length)];

function makeImpulse(sec, decay) {
  const len = Math.floor(ac.sampleRate * sec), buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return buf;
}
function bus(gain, send) {
  const g = ac.createGain(); g.gain.value = gain; g.connect(audioOut);
  const s = ac.createGain(); s.gain.value = send; g.connect(s); s.connect(reverbSend);
  return g;
}
function initAudio() {
  if (ac) { ac.resume(); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
  analyser = ac.createAnalyser(); analyser.fftSize = 2048;
  comp.connect(analyser); analyser.connect(ac.destination);
  audioOut = comp;

  const reverb = ac.createConvolver(); reverb.buffer = makeImpulse(3.8, 2.6);
  const revOut = ac.createGain(); revOut.gain.value = 0.5;
  reverbSend = ac.createGain();
  reverbSend.connect(reverb); reverb.connect(revOut); revOut.connect(comp);

  sfxBus = bus(0.5, 0.35);
  ambBus = bus(1.0, 0.5);
  musicBus = bus(musicOn ? MUSIC_VOL : 0, 0.7);

  // 回聲專屬的延遲效果（讓 ping 有「回音」）
  const delay = ac.createDelay(); delay.delayTime.value = 0.32;
  const fb = ac.createGain(); fb.gain.value = 0.35;
  const lp = ac.createBiquadFilter(); lp.frequency.value = 2200;
  const wet = ac.createGain(); wet.gain.value = 0.4;
  sfxBus.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(wet); wet.connect(comp);

  noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  music.init();
  music.setMood(state === 'title' ? TITLE_MUSIC : cur.music, state === 'title' ? 0 : levelHorror(cur));
}

// 一個音：波形、起始/結束頻率、長度、音量、左右(-1~1)、送到哪一路、何時播放
function tone(type, f0, f1, dur, vol, pan = 0, out = sfxBus, at = 0) {
  if (!ac || vol < 0.002) return;
  const t = Math.max(at, ac.currentTime), o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner();
  o.type = type; p.pan.value = pan;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(p); p.connect(out); o.start(t); o.stop(t + dur + 0.05);
}
// 一段濾波噪音（呼吸、玻璃、風聲…）
function noise(dur, vol, freq, q = 1, pan = 0, out = sfxBus, at = 0) {
  if (!ac || vol < 0.002) return;
  const t = Math.max(at, ac.currentTime), s = ac.createBufferSource(), f = ac.createBiquadFilter();
  const g = ac.createGain(), p = ac.createStereoPanner();
  s.buffer = noiseBuf; s.loop = true; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; p.pan.value = pan;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.3);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(p); p.connect(out); s.start(t, Math.random()); s.stop(t + dur + 0.05);
}
// 3D 定位：越遠越小聲，聲音在左邊就從左耳出來
function spatial(pos, range) {
  if (!player) return { v: 0, pan: 0 };
  const d = flat(pos, player.position);
  return { v: Math.max(0, 1 - d / range) ** 1.5, pan: Math.max(-1, Math.min(1, (pos.x - player.position.x) / 8)) };
}
const now = () => (ac ? ac.currentTime : 0);

const sfx = {
  ping: () => { tone('sine', 1400, 700, 0.9, 0.3); tone('sine', 2100, 1050, 0.6, 0.08); },

  dread: () => { const t0 = now();   // 壞結局：往下沉的不和諧音

  // 死亡驚嚇：噪音爆發 + 往下墜的不和諧尖叫

// ---------- 生成式配樂：和弦、鐘聲、心跳都會隨危險程度改變 ----------
const MOODS = {
  calm:  { chords: [[0, 3, 7, 14], [-4, 0, 3, 7], [3, 7, 10, 14], [-2, 2, 5, 12]], bells: [0, 3, 5, 7, 10], len: 8, cutoff: 900 },
  tense: { chords: [[0, 3, 7, 12], [1, 5, 8, 13], [-2, 1, 5, 10], [0, 3, 6, 10]], bells: [0, 1, 5, 7, 8], len: 7, cutoff: 750 },
  dark:  { chords: [[0, 3, 7, 10], [-5, -2, 2, 7], [1, 4, 8, 13], [-1, 3, 6, 11]], bells: [0, 3, 6, 7, 10], len: 9, cutoff: 600 },
  dread: { chords: [[0, 1, 7, 13], [-1, 3, 6, 10], [0, 6, 7, 13], [-2, 1, 5, 6]], bells: [0, 1, 6, 7, 11], len: 10, cutoff: 520 },
};
const TITLE_MUSIC = ['calm', 50];
const levelHorror = L => L.ch >= 0 ? CHAPTERS[L.ch].horror : L.horror;

const music = {
  key: '', idx: 0, nextChord: 0, nextBell: 0, nextDrip: 0, nextBeat: 0, nextWail: 0, danger: 0, horror: 0, mood: MOODS.calm, root: 50,
  init() {
    const lfo = (freq, depth, target) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = freq; g.gain.value = depth; o.connect(g); g.connect(target); o.start(); };

    this.droneF.connect(this.droneG); this.droneG.connect(musicBus);

    const wg = ac.createGain(); wg.gain.value = 0.1; lfo(0.05, 0.05, wg.gain); lfo(0.031, 120, wf.frequency);
    wind.connect(wf); wf.connect(wg); wg.connect(ambBus); wind.start();

    // 幽影的低語：越近越大聲，會從牠的方向傳來（遊戲提示音）

    const wsf = ac.createBiquadFilter(); wsf.type = 'bandpass'; wsf.frequency.value = 2600; wsf.Q.value = 4;
    const am = ac.createGain(); am.gain.value = 0.5; lfo(11, 0.5, am.gain); lfo(0.4, 700, wsf.frequency);

  },

  wail(t) {

    const o = ac.createOscillator(), vib = ac.createOscillator(), vg = ac.createGain();
    const f1 = ac.createBiquadFilter(), f2 = ac.createBiquadFilter(), g = ac.createGain(), p = ac.createStereoPanner();
    o.type = child ? 'triangle' : 'sawtooth';
    o.frequency.setValueAtTime(base, t); o.frequency.linearRampToValueAtTime(base * (0.68 + Math.random() * 0.2), t + 3);
    vib.frequency.value = 5.5; vg.gain.value = base * 0.02; vib.connect(vg); vg.connect(o.frequency);
    f1.type = f2.type = 'bandpass'; f1.frequency.value = child ? 1100 : 700; f2.frequency.value = child ? 2500 : 1150; f1.Q.value = f2.Q.value = 5;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.14, t + 1); g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
    p.pan.value = Math.random() * 1.6 - 0.8;
    o.connect(f1); o.connect(f2); f1.connect(g); f2.connect(g); g.connect(p); p.connect(ambBus);
    o.start(t); vib.start(t); o.stop(t + 3.3); vib.stop(t + 3.3);
  },
  update(dt, danger, shade) {
    if (!ac) return;
    const t = ac.currentTime;
    this.danger += (danger - this.danger) * Math.min(1, dt * 1.5);
    const D = this.danger;
    if (this.nextChord < t - 1) this.nextChord = t;
    if (this.nextChord < t + 0.2) { this.chord(this.nextChord); this.nextChord += this.mood.len; }

    if (this.nextBell < t - 1) this.nextBell = t;
    if (this.nextBell < t + 0.2) {   // 稀疏的鐘聲旋律，危險時變少
      const n = this.root + 24 + pick(this.mood.bells) + (Math.random() < 0.3 ? 12 : 0), f = midi(n), pan = Math.random() * 1.2 - 0.6;
      if (Math.random() > D) { tone('sine', f, f, 3.2, 0.03, pan, musicBus, this.nextBell); tone('sine', f * 3, f * 3, 1.2, 0.005, pan, musicBus, this.nextBell); }
      this.nextBell += 2.5 + Math.random() * 5;
    }

    if (this.nextDrip < t - 1) this.nextDrip = t;
    if (this.nextDrip < t + 0.2) {   // 遠處的水滴（環境音）
      const f = 1600 + Math.random() * 1800;
      tone('sine', f, f * 0.4, 0.1, 0.05 + Math.random() * 0.07, Math.random() * 1.6 - 0.8, ambBus, this.nextDrip);
      this.nextDrip += 3 + Math.random() * 8;
    }

    if (this.horror > 0) {           // 恐怖章節：偶爾傳來遠處的哭聲或哼唱
      if (this.nextWail < t - 1) this.nextWail = t + 4;
      if (this.nextWail < t + 0.2) { this.wail(this.nextWail); this.nextWail += 10 + Math.random() * 28 * (1.3 - this.horror); }
    }

    if (D > 0.2) {   // 心跳：越危險越快越大聲
      if (this.nextBeat < t) this.nextBeat = t + 0.05;
      if (this.nextBeat < t + 0.15) {
        tone('sine', 62, 38, 0.22, 0.3 * D, 0, musicBus, this.nextBeat);
        tone('sine', 55, 36, 0.18, 0.18 * D, 0, musicBus, this.nextBeat + 0.2);
        this.nextBeat += 60 / (60 + D * 70);
      }
    }
    this.tensionG.gain.setTargetAtTime(D * D * 0.03 + this.horror * 0.004, t, 0.3);
    this.pad.frequency.setTargetAtTime(this.mood.cutoff + D * 1400, t, 0.5);
    this.droneG.gain.setTargetAtTime(0.05 + D * 0.04, t, 0.5);
    this.whisperG.gain.setTargetAtTime(shade.v * 0.12, t, 0.2);
    this.whisperP.pan.setTargetAtTime(shade.pan, t, 0.1);
  },
  duck(sec) {
    if (!ac || !musicOn) return;
    const g = musicBus.gain, t = ac.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(0.08, t + 0.3); g.linearRampToValueAtTime(MUSIC_VOL, t + sec);
  },
  toggle() {
    musicOn = !musicOn;
    try { localStorage.setItem('echo.music', musicOn ? 'on' : 'off'); } catch {}
    if (ac) { const g = musicBus.gain, t = ac.currentTime; g.cancelScheduledValues(t); g.setTargetAtTime(musicOn ? MUSIC_VOL : 0, t, 0.3); }
    return musicOn;
  },
};

// ---------- 路徑搜尋 ----------
function bfs(a, b) {
  const key = (c, r) => r * COLS + c, prev = new Map([[key(...a), null]]), q = [a];
  while (q.length) {
    const [c, r] = q.shift();
    if (c === b[0] && r === b[1]) break;
    for (const [dc, dr] of DIRS) {
      const n = [c + dc, r + dr];
      if (isWall(...n) || prev.has(key(...n))) continue;
      prev.set(key(...n), [c, r]); q.push(n);
    }
  }
  if (!prev.has(key(...b))) return [];
  const path = [];
  for (let cur = b; cur && !(cur[0] === a[0] && cur[1] === a[1]); cur = prev.get(key(...cur))) path.unshift(cur);
  return path;
}
// 哨兵的巡邏路線：所在位置最長的一條直走廊
function corridorEnds(c, r) {
  let best = null;
  for (const [dc, dr] of [[1, 0], [0, 1]]) {
    let a = [c, r], b = [c, r];
    while (!isWall(a[0] - dc, a[1] - dr)) a = [a[0] - dc, a[1] - dr];
    while (!isWall(b[0] + dc, b[1] + dr)) b = [b[0] + dc, b[1] + dr];
    const len = Math.abs(b[0] - a[0]) + Math.abs(b[1] - a[1]);
    if (!best || len > best.len) best = { a, b, len };
  }
  return [best.a, best.b];
}

function guardMesh(type) {
  const mat = new THREE.MeshBasicMaterial({ color: 0x000000 });
  if (type === 'L') {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.46, 24, 12), mat);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.78, 0.035, 8, 48), mat);
    ring.rotation.x = Math.PI / 2; m.add(ring);
    return m;
  }
  if (type === 'T') { const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.42), mat); m.scale.y = 1.7; return m; }
  if (type === 'S') {
    mat.transparent = true; mat.blending = THREE.AdditiveBlending; mat.depthWrite = false;
    return new THREE.Mesh(new THREE.DodecahedronGeometry(0.42), mat);
  }
  if (type === 'H') { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.28, 1.0, 8), mat); m.position.y = 0.5; return m; }
  if (type === 'W') {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 6), mat);
    for (let i = 0; i < 7; i++) m.add(new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), mat));
    return m;
  }
  if (type === 'M') return new THREE.Mesh(new THREE.OctahedronGeometry(0.35), mat);
  return new THREE.Mesh(new THREE.IcosahedronGeometry(0.4, 0), mat);
}

      onPick: o => { run.muts.push(o.key); if (MUTATIONS[o.key].life) run.lives++; go(); } });
  } else go();
}

// ---------- 勝敗 ----------
function end(win) {
  if (!win && run && run.lives > 0) {   // 深淵：第二層皮
    run.lives--; sfx.lose(); music.duck(2);
    resetLevel(); showMsg('第 二 層 皮 剝 落 了', '#c49bff');
    return;
  }
  state = win ? 'win' : 'lose';
  win ? sfx.win() : (sfx.lose(), music.duck(3));
  const L = cur;
  let title, stat, cta;
  if (L.abyss) {
    if (win) {
      progress.abyssBest = Math.max(progress.abyssBest, run.floor); saveProgress();
      title = `第 ${run.floor} 層`;
      stat = `時間 ${playTime.toFixed(1)} 秒　回聲 ${echoes} 次<br><span class="dim">更深的地方在等你。</span>`;
      cta = '點 擊 繼 續 下 潛';
    } else {
      const isBest = run.floor > run.prevBest;
      progress.abyssBest = Math.max(progress.abyssBest, run.floor); saveProgress();
      title = '深淵吞沒了你';
      stat = `${deathMsg}<br>抵達第 ${run.floor} 層` + (isBest ? '　<span class="g">新紀錄</span>' : `（最深紀錄 ${progress.abyssBest} 層）`) +
        (run.muts.length ? `<br><span class="p">${run.muts.map(i => MUTATIONS[i].name).join('・')}</span>` : '');
      cta = '點 擊 回 到 主 選 單';
    }
  } else {
    const rank = echoes <= L.par ? '靜 默 大 師' : echoes <= L.par * 2 ? '夜 行 者' : '迴 響 者';
    const fragLine = frag ? `殘響 ${frag.taken ? '<span class="c">◈ 已找到</span>' : progress.frags[level] ? '◈ 已收錄' : '<span class="dim">◇ 未找到</span>'}` : '';
    if (win) {
      progress.unlocked = Math.max(progress.unlocked, Math.min(level + 1, LEVELS.length - 1));
      const b = progress.best[level];
      if (!b || echoes < b.echoes || (echoes === b.echoes && playTime < b.time)) progress.best[level] = { echoes, time: +playTime.toFixed(1) };
      const mk = progress.marks[level] = progress.marks[level] || {};
      if (progress.frags[level]) mk.f = true;
      if (echoes <= L.par) mk.s = true;
      if (!spotted) mk.u = true;
      saveProgress();
    }
    const lastInCh = L.j === CHAPTERS[L.ch].levels.length - 1;
    title = win ? '逃脫' : '被發現了';
    stat = (win ? '' : `${deathMsg}<br>`) + `${levelLabel(L)}<br>時間 ${playTime.toFixed(1)} 秒　回聲 ${echoes} 次（目標 ${L.par}）<br>` +
      fragLine + (win ? `<br>${spotted ? '<span class="dim">● 曾被發現</span>' : '<span class="g">● 全程未被發現</span>'}<br><span class="g">${rank}</span>` : '');
    cta = !win ? '點 擊 重 試 ・ ESC 回 主 選 單' : lastInCh ? '點 擊 繼 續' : '點 擊 進 入 下 一 關';
  }
  $('endTitle').textContent = title;
  $('endTitle').style.textShadow = win ? '' : '0 0 24px var(--r), 0 0 70px rgba(255,90,106,.45)';
  $('endStat').innerHTML = stat;
  $('endCta').textContent = cta;
  $('hud').classList.add('hidden');
  clearTimeout(endTimer);
  endTimer = setTimeout(() => { if (state === 'win' || state === 'lose') $('end').classList.remove('hidden'); }, 600);
}
function endClick() {
  if (state === 'lose') return run ? goTitle() : startLevel(level);
  if (state !== 'win') return;
  if (run) return nextAbyssFloor();
  const L = cur;
  if (L.j === CHAPTERS[L.ch].levels.length - 1) return runChoice(L.ch);
  startLevel(level + 1);
}

addEventListener('pointerdown', () => initAudio(), { once: true });
addEventListener('keydown', () => initAudio(), { once: true });
$('title').addEventListener('click', () => { const i = Math.min(progress.unlocked, LEVELS.length - 1); startLevel(i, { story: LEVELS[i].j === 0 }); });
$('end').addEventListener('click', endClick);
$('archBtn').addEventListener('click', e => { e.stopPropagation(); openArchive(); });
$('galBtn').addEventListener('click', e => { e.stopPropagation(); openGallery(); });

$('gallery').addEventListener('click', closePanels);

addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (state === 'read') { if (e.code === 'Escape') goTitle(); else if (!e.repeat) closeCard(); return; }
  if (state === 'choice') { const n = Number(e.key); if (n >= 1 && n <= 3) pickChoice(n - 1); return; }
  if (panelOpen()) { closePanels(); return; }
  if (e.repeat && keys[e.code]) return;
  keys[e.code] = true;
  if (state === 'play' && introT > 0) { endIntro(); return; }
  if (e.code === 'Enter') { if (state === 'title') $('title').click(); else if (state !== 'play') endClick(); }
  if (e.code === 'Escape' && state !== 'title') goTitle();

  if (e.code === 'KeyE' && state === 'play') throwStone();
  if (e.code === 'KeyQ' && state === 'play') scream();

});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ---------- 玩家 ----------
function blocked(x, z, r = 0.3) {
  for (const [ox, oz] of [[-r, -r], [r, -r], [-r, r], [r, r]]) if (isWall(...toCell(x + ox, z + oz))) return true;
  return false;
}
function hear(origin, kind, mult = 1) {
  for (const g of guards) {
    if (g.dead) continue;
    const R = (g.cfg.hear[kind] || 0) * C.hearMul * mult;
    if (!R || flat(g.pos, origin) > R) continue;
    alertGuard(g, origin, kind === 'stone' ? '牠 被 石 頭 吸 引 了' : `${g.cfg.name} 聽 見 了 你`, kind);
  }
}
function alertGuard(g, origin, text, cause) {
  if (g.dead) return;
  if (cause !== 'stone') spotted = true;
  if (g.mode !== 'hunt' && !(g.stunT > 0)) {
    sfx.alert(); showMsg(text, '#ff5a6a');
    if (cause !== 'stone') spottedJolt();
  }
  goTo(g, cellOf(origin), 'hunt');
  g.wait = 1.6;
}
// 被發現的瞬間：重擊音、鏡頭震動、紅光一閃、恐懼上升
function spottedJolt() {
  sfx.sting(); shake = Math.max(shake, 0.35); hitFlash = Math.max(hitFlash, 0.22); fear = Math.min(100, fear + 15);
}

// ---------- 攻擊：尖嘯（有代價的反擊） ----------
function scream() {
  if (introT > 0) return;
  if (screamsLeft <= 0) { showMsg('你 的 喉 嚨 已 經 撕 裂 了', '#ff5a6a'); return; }
  screamsLeft--; updateHud(); spotted = true;
  addPulse(player.position, 14, 1.3, 1.8, 4, 0.5, true);
  addPulse(player.position, CONFIG.screamRadius * 2, 1.0, 1.2, 2, 0.1);
  shake = 0.8; hitFlash = 0.5; fear = Math.max(0, fear - 35);
  sfx.scream();
  let n = 0;
  for (const g of guards) {
    if (g.dead || flat(g.pos, player.position) > CONFIG.screamRadius) continue;
    n++;
    if (g.type === 'W' || g.type === 'M') {          // 蟲群、擬聲者：直接震碎
      g.dead = true; g.mesh.visible = false;
      addPulse(g.pos, 6, 1.2, 1.2, g.type === 'M' ? 1 : 2, 0.5); sfx.shatter(g.pos);
    } else if (g.type === 'S') {                     // 幽影：殺不死，只能震退
      const vx = g.pos.x - player.position.x, vz = g.pos.z - player.position.z, m = Math.hypot(vx, vz) || 1;
      g.pos.x += vx / m * 6; g.pos.z += vz / m * 6; g.delay = 2.5;
    } else { g.stunT = CONFIG.stunTime; g.path = []; g.mode = 'idle'; }   // 其他：暈眩
  }
  hear(player.position, 'echo', 2.5);   // 代價：整座城都聽見了
  showMsg(n ? `尖 嘯 震 倒 了 ${n} 個 東 西 —— 但 牠 們 全 都 聽 見 了` : '尖 嘯 迴 盪 在 黑 暗 中 —— 牠 們 全 都 聽 見 了', '#ffffff');
}

// ---------- 恐懼：被追、靠近敵人、黑暗都會累積；靜止或靠近金光會平復 ----------
function updateFear(dt, danger) {
  const hunting = guards.some(g => !g.dead && !(g.stunT > 0) && g.mode === 'hunt' && g.type !== 'M' && flat(g.pos, player.position) < 12);
  const nearGold = crystals.some(c => c.mesh.visible && flat(c.mesh.position, player.position) < 3.5);
  const sneaking = keys.ShiftLeft || keys.ShiftRight;
  const gain = danger * 14 + (hunting ? 6 : 0) + 0.8;
  const calm = (!playerMoving ? 7 : 0) + (nearGold ? 10 : 0) + (sneaking && !hunting ? 2 : 0);
  fear = Math.min(100, Math.max(0, fear + (gain * C.fearMul - calm) * dt));
  if (fear > 70 && (pantT -= dt) <= 0) { pantT = 1.3 - fear / 200; sfx.pant(); }
  if (fear >= 65 && (halluT -= dt) <= 0) { halluT = 2 + Math.random() * 3 * (1.6 - fear / 100); hallucinate(); }
  if (fear >= 100) panic();
}
// 恐懼滿了：忍不住叫出聲（等於一次很大聲的回聲）
function panic() {
  fear = 55; echoes++; lastEchoT = time; spotted = true;
  addPulse(player.position, C.echoSpeed * 1.2, C.echoLife, 1.3, 4, 0.5, true);
  hear(player.position, 'echo', 1.5);
  sfx.panic(); shake = Math.max(shake, 0.5); hitFlash = 0.35;
  showMsg('你 忍 不 住 叫 出 聲 來', '#ff5a6a');
}
// 幻覺：不存在的腳步聲，或一閃而過的人影
function hallucinate() {
  const a = Math.random() * Math.PI * 2, r = 3 + Math.random() * 4;
  const p = { x: player.position.x + Math.cos(a) * r, z: player.position.z + Math.sin(a) * r };
  if (Math.random() < 0.6) { addPulse(p, 3, 1.1, 0.55, 2, 0.05); sfx.guardStep(p, Math.random() < 0.5); }
  else { apparition.position.set(p.x, 0.55, p.z); apparition.userData.t = 0.35; apparition.visible = true; sfx.ghost(p); }
}
// 被抓：先播死亡驚嚇，再進結算
function die(g, msg) {
  deathMsg = msg;
  if (run && run.lives > 0) return end(false);
  state = 'dying'; dyingT = 1.1; killer = g; hitFlash = 1; shake = 1;
  for (const k in keys) keys[k] = false;
  $('hud').classList.add('hidden');
  sfx.jumpscare();
}

function throwStone() {
  if (stonesLeft <= 0 || introT > 0) return;
  stonesLeft--; updateHud(); sfx.throw();
  const from = player.position.clone(), to = from.clone();
  for (let d = 0; d < C.stoneRange; d += 0.2) {
    const nx = from.x + lastDir.x * d, nz = from.z + lastDir.z * d;
    if (blocked(nx, nz, 0.15)) break;
    to.set(nx, 0.1, nz);
  }
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.6, 2, 2.2) }));
  m.position.copy(from); dyn.add(m);
  stones.push({ mesh: m, from, to, t: 0, dur: 0.25 + from.distanceTo(to) * 0.05 });
}
function updateStones(dt) {
  for (const s of stones) {
    s.t = Math.min(1, s.t + dt / s.dur);
    s.mesh.position.lerpVectors(s.from, s.to, s.t);
    s.mesh.position.y = 0.4 + 4 * 1.2 * s.t * (1 - s.t);
    if (s.t === 1) {
      dyn.remove(s.mesh); s.mesh.geometry.dispose();
      addPulse(s.to, 7, 1.6, 0.6, 0, 0.1);
      for (const g of guards) {   // 直接砸中：暈眩 2 秒
        if (g.dead || g.type === 'S' || g.type === 'M' || flat(g.pos, s.to) > 1.0) continue;
        g.stunT = 2; g.path = []; g.mode = 'idle'; sfx.stunHit(g.pos); showMsg('擊 中 了', '#dff6ff');
      }
      hear(s.to, 'stone'); sfx.clack(s.to);
    }
  }
  stones = stones.filter(s => s.t < 1);
}

function updatePlayer(dt) {
  const dx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const dz = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  const sneak = keys.ShiftLeft || keys.ShiftRight;
  playerMoving = !!(dx || dz);
  if (playerMoving) {
    const m = Math.hypot(dx, dz), sp = (sneak ? C.sneakSpeed : C.moveSpeed) * dt;
    lastDir.set(dx / m, 0, dz / m);
    const nx = player.position.x + dx / m * sp, nz = player.position.z + dz / m * sp;
    if (!blocked(nx, player.position.z)) player.position.x = nx;
    if (!blocked(player.position.x, nz)) player.position.z = nz;

    const cell = cellOf(player.position), onGlass = MAP[cell[1]][cell[0]] === '~';
    const entered = cell[0] !== lastCell[0] || cell[1] !== lastCell[1];
    lastCell = cell;
    if (onGlass) {
      glassT -= dt;
      if (entered || glassT <= 0) {
        glassT = 0.42;
        addPulse(player.position, 8, 1.3, 1.0, 0, 0.05);
        hear(player.position, 'glass'); sfx.glass();
      }
    } else if (!sneak && (stepT -= dt) <= 0) {
      stepT = 0.42;
      addPulse(player.position, 5, 0.9, 0.4, 0, 0.05);
      hear(player.position, 'step'); sfx.step();
    }
  }
  player.scale.setScalar(sneak ? 0.8 : 1);

  cd = Math.max(0, cd - dt);
  if (keys.Space && cd === 0) {
    cd = C.echoCooldown; echoes++; lastEchoT = time;
    addPulse(player.position, C.echoSpeed, C.echoLife, 1.0, 0, 0.5, true);
    hear(player.position, 'echo'); sfx.ping();
  }
  $('cd').style.width = `${(1 - cd / C.echoCooldown) * 100}%`;

  for (const c of crystals) {
    if (c.mesh.visible && c.mesh.position.distanceTo(player.position) < 0.9) {
      c.mesh.visible = false; collected++; updateHud(); sfx.chime();
      fear = Math.max(0, fear - 25);
      addPulse(c.mesh.position, 7, 1.6, 0.9, 1);
      if (collected === crystals.length) {
        exit.userData.open = true; exit.material.color.setRGB(1.5, 2.0, 2.2);
        showMsg('出 口 已 開 啟', '#7fe9ff');
      } else showMsg(`音 核  ${collected} / ${crystals.length}`, '#ffcf6b');
    }
  }
  if (frag && !frag.taken && flat(frag.mesh.position, player.position) < 0.8) return readFragment();
  if (exit.userData.open && flat(exit.position, player.position) < 1) end(true);
}

// ---------- 守衛 AI ----------
function goTo(g, target, mode, maxSteps = Infinity) {
  const c0 = cellOf(g.pos);
  g.path = [c0, ...bfs(c0, target).slice(0, maxSteps)];
  g.mode = mode;
}
function idleBehavior(g) {
  const c0 = cellOf(g.pos);
  if (g.type === 'G' || g.type === 'H') {
    goTo(g, pick(openCells), 'patrol', g.type === 'H' ? 4 : 6);
    g.wait = 0.6 + Math.random() * (g.type === 'H' ? 2.5 : 1);
  } else if (g.type === 'L') {
    if (c0[0] !== g.home[0] || c0[1] !== g.home[1]) goTo(g, g.home, 'return');
    else g.mode = 'idle';
    g.wait = 0.5;
  } else if (g.type === 'T') {
    const t = g.route[g.routeIdx];
    if (c0[0] === t[0] && c0[1] === t[1]) g.routeIdx ^= 1;
    goTo(g, g.route[g.routeIdx], 'patrol');
    g.wait = 0.4;
  } else { g.mode = 'idle'; g.wait = 0.5; }
}
function updateGuards(dt) {
  const echoActive = time - lastEchoT < C.echoLife;
  for (const g of guards) {
    if (g.dead) continue;
    const d = flat(g.pos, player.position);
    let k;
    if (g.stunT > 0) {   // 暈眩中：不會動、不會抓人
      g.stunT -= dt;
      const f = 0.35 + 0.25 * Math.sin(time * 20);
      g.mesh.material.color.setRGB(f * 1.6, f * 1.6, f * 1.7);
      g.mesh.rotation.z = Math.sin(time * 3) * 0.4;
      if (g.stunT <= 0) { g.mesh.rotation.z = 0; if (g.type !== 'S') { goTo(g, cellOf(player.position), 'hunt'); g.huntT = 0; } }
      continue;
    }

    if (g.type === 'M') {
      // 擬聲者：假裝是音核。嗡鳴走音；被藍色回聲照到會現出紅色原形
      if ((g.stepT -= dt) <= 0) { g.stepT = C.humEvery + 0.35; addPulse(g.pos, 4, 1.8, 0.7, 1, 0.9); sfx.hum(g.pos, g.note); }
      if (revealAt(g.pos, [0]) > 0.25) g.exposedT = 1.6;   // 被照到後，紅色原形會維持一小段時間
      g.exposedT = Math.max(0, (g.exposedT || 0) - dt);
      const exposed = g.exposedT > 0;
      g.mesh.material.color.setRGB(...(exposed ? [2.4, 0.15, 0.2] : [2.2, 1.5, 0.5]));
      g.mesh.rotation.y += dt * (exposed ? 7 : 1.2);
      g.mesh.position.y = 0.9 + Math.sin(time * 2 + g.home[0]) * 0.12;
      if (d < 0.8) return die(g, '那不是音核。');
      continue;
    }

    if (g.type === 'S') {
      // 幽影：穿牆、緩慢、永遠朝你飄來；只有金光和近距離能看見
      if (g.delay > 0) g.delay -= dt;
      else {
        const vx = player.position.x - g.pos.x, vz = player.position.z - g.pos.z, m = Math.hypot(vx, vz) || 1;
        g.pos.x += vx / m * g.cfg.speed * C.guardSpeedMul * dt; g.pos.z += vz / m * g.cfg.speed * C.guardSpeedMul * dt;
      }
      if ((g.stepT -= dt) <= 0) { g.stepT = 1.6; addPulse(g.pos, 2, 1.0, 0.35, 3, 0.05); }
      k = Math.max(revealAt(g.pos, [1]), d < 4 ? (4 - d) / 4 * 0.8 : 0);
      g.mesh.rotation.x += dt * 0.7;
    } else {
      if (g.cfg.chaseNear && d < g.cfg.chaseNear && (g.repath -= dt) <= 0) {
        if (g.mode !== 'hunt') spottedJolt();
        g.repath = 0.35; spotted = true; goTo(g, cellOf(player.position), 'hunt'); g.wait = 1.6;
      }
      let moved = false;
      g.huntT = g.mode === 'hunt' ? (g.huntT || 0) + dt : 0;   // 追得越久，跑得越快
      const canMove = !g.cfg.swarm || echoActive;   // 蟲群：只在回聲響著時移動
      if (g.path.length && canMove) {
        const [c, r] = g.path[0], tx = c * S, tz = r * S;
        const vx = tx - g.pos.x, vz = tz - g.pos.z, dist = Math.hypot(vx, vz);
        const sp = (g.mode === 'hunt' ? g.cfg.hunt * (1 + Math.min(0.35, g.huntT * 0.07)) : g.cfg.speed) * C.guardSpeedMul * dt;
        if (dist <= sp) { g.pos.x = tx; g.pos.z = tz; g.path.shift(); }
        else { g.pos.x += vx / dist * sp; g.pos.z += vz / dist * sp; }
        moved = true;
      } else if (!g.path.length && (g.wait -= dt) <= 0) idleBehavior(g);

      // 腳步聲（紅色波紋）；空殼完全無聲
      if (!g.cfg.silent && (g.stepT -= dt) <= 0) {
        if (moved) {
          g.stepT = g.cfg.swarm ? 0.3 : g.mode === 'hunt' ? 0.45 : 0.85;
          addPulse(g.pos, 3, 1.1, g.cfg.swarm ? 0.4 : 0.55, 2, 0.05);
          g.cfg.swarm ? sfx.chitter(g.pos) : sfx.guardStep(g.pos, g.mode === 'hunt');
          g.flash = 1;
        } else if (!g.cfg.swarm) {
          g.stepT = 2.2; addPulse(g.pos, 1.6, 1.4, 0.35, 2, 0.05); sfx.breath(g.pos); g.flash = 1;
        } else g.stepT = 0.5;
      }

      // 哨兵掃描：紅色波紋經過你時，你在移動就會被發現
      if (g.cfg.sweep) {
        const sw = g.cfg.sweep;
        if ((g.sweepT -= dt) <= 0) {
          g.sweepT = sw.every;
          addPulse(g.pos, sw.speed, sw.life, 0.9, 2, 0.6);
          g.sweep = { x: g.pos.x, z: g.pos.z, t0: time, done: false };
          g.flash = 1.5;
          sfx.sweep(g.pos);
        }
        if (g.sweep && !g.sweep.done) {
          const r = (time - g.sweep.t0) * sw.speed;
          if (r > sw.range) g.sweep.done = true;
          else if (playerMoving && Math.abs(flat(g.sweep, player.position) - r) < 0.6) {
            g.sweep.done = true;
            alertGuard(g, player.position, '被 哨 兵 掃 描 到 了', 'sweep');
          }
        }
      }
      if (g.cfg.swarm) g.mesh.children.forEach((s, i) => {
        const sp = moved ? 7 : 1.2;
        s.position.set(Math.cos(time * sp + i * 0.9) * 0.34, Math.sin(time * 5 + i * 2) * 0.14, Math.sin(time * sp * 1.1 + i * 0.9) * 0.34);
      });
      g.flash = Math.max(0, g.flash - dt * 3);
      k = Math.max(revealAt(g.pos, [0]), g.flash * 0.5, d < 3 ? (3 - d) / 3 * 0.6 : 0);
      if (g.type !== 'H') g.mesh.rotation.y += dt * (g.mode === 'hunt' ? 4 : 1.2);
    }

    const [cr, cg, cb] = g.cfg.color;
    g.mesh.material.color.setRGB(k * cr, k * cg, k * cb);
    g.mesh.position.y = (g.type === 'H' ? 0.55 : 0.5) + Math.sin(time * 3 + g.home[0]) * 0.06;
    if (d < (g.type === 'L' ? 0.85 : 0.7)) {
      return die(g, g.type === 'S' ? '幽影吞沒了你。' : `你被${g.cfg.name}抓住了。`);
    }
  }
}

// ---------- 主迴圈 ----------
const clock = new THREE.Clock();
const focus = new THREE.Vector3();
let titlePulseT = 0;
loadMap(cur); resetLevel(); buildTitle();

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;
  U.uTime.value = time;

  if (state === 'play') {
    if (introT > 0) { introT -= dt; if (introT <= 0) { introT = 0.001; endIntro(); } }
    else {
      playTime += dt;
      updatePlayer(dt);
      updateStones(dt);
      if (state === 'play') updateGuards(dt);
      if (state === 'play' && C.exitPulse && (exitPulseT -= dt) <= 0) { exitPulseT = 3; addPulse(exit.position, 5, 2, 0.6, 0, 1); }
    }
  }
  if (state === 'read' || state === 'choice') readT -= dt;
  if (state === 'dying') {   // 死亡驚嚇：怪物衝到眼前
    dyingT -= dt;
    const m = killer.mesh;
    m.scale.setScalar(Math.min(1.9, 1 + (1.1 - dyingT) * 1.2));
    const on = Math.random() < 0.55;   // 紅光與全黑之間的頻閃
    m.material.color.setRGB(on ? 2.2 : 0.02, on ? 0.05 : 0, on ? 0.08 : 0);
    if (Math.random() < 0.25) addPulse(killer.pos, 10, 0.5, 1.2, 2, 0.6);
    if (dyingT <= 0) { m.scale.setScalar(1); end(false); }
  }
  if (apparition && apparition.visible) {
    apparition.userData.t -= dt;
    const k = Math.max(0, apparition.userData.t / 0.35) * 1.4;
    apparition.material.color.setRGB(k * 1.8, k * 1.7, k * 1.6);
    if (apparition.userData.t <= 0) apparition.visible = false;
  }

  for (const c of crystals) {
    if (!c.mesh.visible) continue;
    c.mesh.rotation.y += dt * 1.2;
    c.mesh.position.y = 0.9 + Math.sin(time * 2 + c.hum) * 0.12;
    if ((c.hum -= dt) <= 0) {
      c.hum = C.humEvery; addPulse(c.mesh.position, 4, 1.8, 0.7, 1);
      if (state === 'play' && introT <= 0) sfx.hum(c.mesh.position, c.note);
    }
  }
  exit.rotation.y += dt * (exit.userData.open ? 1.5 : 0.3);

  // 殘響：平常看不見，只有藍色回聲掃過或走得很近時才會閃爍
  if (frag && !frag.taken) {
    const m = frag.mesh, d = flat(m.position, player.position);
    const flick = 0.75 + 0.25 * Math.sin(time * 9) * Math.sin(time * 2.3);
    const k = Math.max(revealAt(m.position, [0]) * 1.3, d < 2.5 ? (2.5 - d) / 2.5 * 0.9 : 0) * flick;
    m.material.color.setRGB(1.7 * k, 1.9 * k, 2.3 * k);
    m.rotation.x += dt * 0.9; m.rotation.y += dt * 1.3;
    m.position.y = 0.7 + Math.sin(time * 1.5) * 0.08;
  }
  // 結局演出：金色 = 城市亮起；白色 = 被吞噬
  if (dawn && (dawnT -= dt) <= 0) {
    dawnT = 0.12;
    const [c, r] = pick(openCells);
    addPulse({ x: c * S, z: r * S }, 6, 3, dawn === 'white' ? 1.6 : 1.0, dawn === 'white' ? 0 : (Math.random() < 0.7 ? 1 : 0), 0.5);
  }

  if (state === 'title') {
    if ((titlePulseT -= dt) <= 0) {
      titlePulseT = 1.5;
      const [c, r] = pick(openCells);
      addPulse({ x: c * S, z: r * S }, 8, 2.8, 1.0, 0, 0.5);
    }
    const a = time * 0.08, R = Math.max(COLS, ROWS) * S * 0.85;
    camera.position.set(CENTER.x + Math.cos(a) * R, R * 0.9, CENTER.z + Math.sin(a) * R);
    camera.lookAt(CENTER);
    U.uPlayer.value.set(9999, 0, 9999);
  } else if (state === 'dying' && killer) {
    const k = 1 - Math.exp(-dt * 9), kp = killer.pos;
    camera.position.lerp(new THREE.Vector3(kp.x, 2.0, kp.z + 3.4), k);
    focus.lerp(new THREE.Vector3(kp.x, 0.6, kp.z), k);
    camera.lookAt(focus);
  } else {
    const k = 1 - Math.exp(-dt * 4);
    camera.position.lerp(new THREE.Vector3(player.position.x, 13, player.position.z + 9), k);
    focus.lerp(player.position, k);
    camera.lookAt(focus);
    U.uPlayer.value.copy(player.position);
  }
  if (shake > 0) {   // 鏡頭震動
    camera.position.x += (Math.random() - 0.5) * shake * 0.6;
    camera.position.y += (Math.random() - 0.5) * shake * 0.6;
    shake = Math.max(0, shake - dt * 2.2);
  }

  // 危險程度 → 配樂（心跳、和弦變亮、緊張顫音）；幽影 → 低語
  let danger = 0, shade = { v: 0, pan: 0 };
  if (state === 'play' && introT <= 0) {
    for (const g of guards) {
      if (g.type === 'M' || g.dead || g.stunT > 0) continue;
      if (g.type === 'S') { if (g.delay <= 0) { const s = spatial(g.pos, 7); if (s.v > shade.v) shade = s; danger = Math.max(danger, s.v * 0.9); } continue; }
      const gd = flat(g.pos, player.position);   // 追擊中的守衛越近越危險；遠處的追擊只帶來一點不安
      danger = Math.max(danger, g.mode === 'hunt' ? Math.max(0.3, 1 - gd / 16) : Math.max(0, 1 - gd / 7) * 0.7);
    }
  }
  if (state === 'play' && introT <= 0) updateFear(dt, danger);
  music.update(dt, Math.max(danger, (state === 'play' ? fear / 100 : 0) * 0.8), shade);

  const fearTarget = state === 'dying' ? 1 : state === 'play' && introT <= 0 ? fear / 100 : 0;
  fearFx += (fearTarget - fearFx) * Math.min(1, dt * 3);
  hitFlash = Math.max(0, hitFlash - dt * 1.8);
  fx.uniforms.uTime.value = time; fx.uniforms.uFear.value = fearFx; fx.uniforms.uHit.value = hitFlash;
  $('fearBar').style.width = `${fear}%`;

  uploadPulses();
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 除錯用：在瀏覽器 Console 輸入 ECHO 可查看狀態
window.ECHO = {
  get state() { return state; }, get level() { return level; }, get player() { return player; },
  get guards() { return guards; }, get collected() { return collected; }, get stonesLeft() { return stonesLeft; },
  get introT() { return introT; }, get progress() { return progress; }, get time() { return time; },
  get frag() { return frag; }, get dawn() { return dawn; }, get run() { return run; }, get spotted() { return spotted; },
  get cur() { return cur; }, get C() { return C; }, get fear() { return fear; }, setFear: v => { fear = v; },
  get screamsLeft() { return screamsLeft; }, scream, get shake() { return shake; }, DIFFS, get killer() { return killer; }, get pulses() { return pulses; }, get deathMsg() { return deathMsg; },
  audio() {
    if (!analyser) return null;
    const a = new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(a);
    let peak = 0, sum = 0; for (const x of a) { peak = Math.max(peak, Math.abs(x)); sum += x * x; }
    return { ctx: ac.state, peak: +peak.toFixed(3), rms: +Math.sqrt(sum / a.length).toFixed(4), danger: +music.danger.toFixed(2), musicOn, mood: music.key };
  },
  crystals: () => crystals, exit: () => exit, startLevel, endIntro, goTitle, bfs, LEVELS, CHAPTERS, STORY, CHOICES, ENDINGS,
  get MAP() { return MAP; }, readFragment, closeFragment: closeCard, closeCard, openArchive, openGallery,
  generateMap, abyssLevel, startAbyss, pickChoice, computeEnding, runChoice, endClick, MUTATIONS,
};
</script>
