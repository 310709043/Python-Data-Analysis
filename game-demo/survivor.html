<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小小倖存者 Demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1016; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; background: #1b1f2a; border-radius: 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// =====================================================================
//  小小倖存者 — 一個「類吸血鬼倖存者」玩法原型
//  操作：WASD / 方向鍵移動，角色會自動朝最近的敵人射擊。
//  新手修改建議：先只改下面 CONFIG 裡的數字，存檔後重新整理瀏覽器看看差異。
// =====================================================================
const CONFIG = {
  playerHp: 100,          // 玩家初始生命
  playerSpeed: 180,       // 移動速度（像素/秒）
  bulletDamage: 10,       // 子彈傷害
  fireRate: 1.5,          // 每秒射擊次數
  bulletSpeed: 420,
  enemyBaseHp: 10,        // 敵人基礎血量（會隨時間增加）
  enemyBaseSpeed: 55,
  contactDamage: 8,       // 被敵人碰到扣多少血
  firstLevelXp: 5,        // 第一次升級需要的經驗
};

// 升級選項：想加新能力，就在這裡多寫一個 { name, desc, apply }
const UPGRADES = [
  { name: '強力子彈', desc: '傷害 +25%',          apply: p => p.dmg *= 1.25 },
  { name: '快速射擊', desc: '攻速 +20%',          apply: p => p.rate *= 1.2 },
  { name: '輕盈步伐', desc: '移速 +12%',          apply: p => p.speed *= 1.12 },
  { name: '散射',     desc: '每次多射 1 發',       apply: p => p.count += 1 },
  { name: '強健體魄', desc: '最大生命 +20 並回滿', apply: p => { p.maxHp += 20; p.hp = p.maxHp; } },
  { name: '磁鐵',     desc: '吸取經驗範圍 +40%',   apply: p => p.magnet *= 1.4 },
  { name: '穿透',     desc: '子彈可多穿透 1 個敵人', apply: p => p.pierce += 1 },
];

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width = 960, H = cv.height = 600;

let state = 'title';           // title | play | levelup | dead
let player, enemies, bullets, gems, particles, spawnTimer, time, kills, choices;
const keys = {};

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const rand = (a, b) => a + Math.random() * (b - a);

function reset() {
  player = {
    x: W / 2, y: H / 2, r: 12,
    hp: CONFIG.playerHp, maxHp: CONFIG.playerHp,
    speed: CONFIG.playerSpeed, dmg: CONFIG.bulletDamage, rate: CONFIG.fireRate,
    count: 1, pierce: 0, magnet: 60, cd: 0, inv: 0,
    xp: 0, lvl: 1, next: CONFIG.firstLevelXp,
  };
  enemies = []; bullets = []; gems = []; particles = [];
  spawnTimer = 0; time = 0; kills = 0;
  state = 'play';
}

// ---------- 敵人生成 ----------
function spawnEnemy() {
  const side = Math.floor(Math.random() * 4);
  const x = side === 0 ? -20 : side === 1 ? W + 20 : rand(0, W);
  const y = side === 2 ? -20 : side === 3 ? H + 20 : rand(0, H);
  const big = time > 30 && Math.random() < 0.06;
  const hp = (CONFIG.enemyBaseHp + time * 0.25) * (big ? 5 : 1);
  enemies.push({
    x, y, hp, maxHp: hp, flash: 0,
    r: big ? 22 : 11,
    speed: (CONFIG.enemyBaseSpeed + rand(0, 30) + Math.min(time, 120) * 0.3) * (big ? 0.6 : 1),
    xp: big ? 5 : 1,
    color: big ? '#c0392b' : '#e74c3c',
  });
}

// ---------- 自動射擊 ----------
function shoot() {
  let target = null, best = Infinity;
  for (const e of enemies) { const d = dist(e, player); if (d < best) { best = d; target = e; } }
  if (!target) return;
  const base = Math.atan2(target.y - player.y, target.x - player.x);
  for (let i = 0; i < player.count; i++) {
    const a = base + (i - (player.count - 1) / 2) * 0.18;
    bullets.push({
      x: player.x, y: player.y,
      vx: Math.cos(a) * CONFIG.bulletSpeed, vy: Math.sin(a) * CONFIG.bulletSpeed,
      dmg: player.dmg, left: 1 + player.pierce, life: 1.3, hit: new Set(),
    });
  }
}

function burst(x, y, color, n = 8) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(40, 160);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.2, 0.45), color });
  }
}

// ---------- 升級 ----------
function checkLevelUp() {
  if (player.xp < player.next) return;
  player.xp -= player.next;
  player.lvl++;
  player.next = Math.floor(player.next * 1.35 + 3);
  const pool = [...UPGRADES];
  choices = [];
  while (choices.length < 3 && pool.length) choices.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  state = 'levelup';
}

function pick(i) {
  if (state !== 'levelup' || !choices[i]) return;
  choices[i].apply(player);
  state = 'play';
  checkLevelUp(); // 一次吃很多經驗時可能連續升級
}

// ---------- 每幀更新 ----------
function update(dt) {
  time += dt;

  // 移動
  let dx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  let dy = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
  const m = Math.hypot(dx, dy) || 1;
  player.x = clamp(player.x + dx / m * player.speed * dt, player.r, W - player.r);
  player.y = clamp(player.y + dy / m * player.speed * dt, player.r, H - player.r);
  player.inv = Math.max(0, player.inv - dt);

  // 生成敵人：時間越久越密集
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnTimer = Math.max(0.12, 0.9 - time * 0.008);
    const n = 1 + Math.floor(time / 30);
    for (let i = 0; i < n; i++) spawnEnemy();
  }

  // 射擊
  player.cd -= dt;
  if (player.cd <= 0 && enemies.length) { shoot(); player.cd = 1 / player.rate; }

  // 子彈
  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    for (const e of enemies) {
      if (b.left <= 0 || b.hit.has(e) || e.hp <= 0) continue;
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 4) {
        e.hp -= b.dmg; e.flash = 0.08; b.hit.add(e); b.left--;
      }
    }
    if (b.left <= 0) b.life = 0;
  }
  bullets = bullets.filter(b => b.life > 0 && b.x > -30 && b.x < W + 30 && b.y > -30 && b.y < H + 30);

  // 敵人
  for (const e of enemies) {
    const a = Math.atan2(player.y - e.y, player.x - e.x);
    e.x += Math.cos(a) * e.speed * dt; e.y += Math.sin(a) * e.speed * dt;
    e.flash = Math.max(0, e.flash - dt);
    if (player.inv <= 0 && dist(e, player) < e.r + player.r) {
      player.hp -= CONFIG.contactDamage + Math.floor(time / 60) * 2;
      player.inv = 0.5;
      burst(player.x, player.y, '#ffffff', 6);
      if (player.hp <= 0) { player.hp = 0; state = 'dead'; }
    }
    if (e.hp <= 0) {
      kills++;
      gems.push({ x: e.x, y: e.y, v: e.xp });
      burst(e.x, e.y, e.color);
    }
  }
  enemies = enemies.filter(e => e.hp > 0);

  // 經驗寶石
  for (const g of gems) {
    const d = dist(g, player);
    if (d < player.magnet) {
      const a = Math.atan2(player.y - g.y, player.x - g.x);
      g.x += Math.cos(a) * 320 * dt; g.y += Math.sin(a) * 320 * dt;
    }
    if (d < player.r + 6) { player.xp += g.v; g.v = 0; }
  }
  gems = gems.filter(g => g.v > 0);

  // 粒子
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);

  if (state === 'play') checkLevelUp();
}

// ---------- 繪圖 ----------
function drawGrid() {
  ctx.strokeStyle = '#232838'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
}

function circle(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

function text(s, x, y, size = 18, color = '#eef', align = 'left') {
  ctx.fillStyle = color; ctx.font = `bold ${size}px "Noto Sans TC", "Microsoft JhengHei", sans-serif`;
  ctx.textAlign = align; ctx.fillText(s, x, y);
}

function drawHud() {
  // 經驗條
  ctx.fillStyle = '#2b3145'; ctx.fillRect(0, 0, W, 10);
  ctx.fillStyle = '#4fc3f7'; ctx.fillRect(0, 0, W * player.xp / player.next, 10);
  // 生命條
  ctx.fillStyle = '#2b3145'; ctx.fillRect(16, 22, 200, 14);
  ctx.fillStyle = '#2ecc71'; ctx.fillRect(16, 22, 200 * player.hp / player.maxHp, 14);
  text(`HP ${Math.ceil(player.hp)}/${player.maxHp}`, 224, 35, 14);
  const mm = String(Math.floor(time / 60)).padStart(2, '0'), ss = String(Math.floor(time % 60)).padStart(2, '0');
  text(`${mm}:${ss}`, W / 2, 40, 24, '#fff', 'center');
  text(`等級 ${player.lvl}   擊殺 ${kills}`, W - 16, 35, 16, '#eef', 'right');
}

const cardRects = [0, 1, 2].map(i => ({ x: 150 + i * 230, y: 220, w: 200, h: 170 }));

function drawLevelUp() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
  text('升級！選擇一個能力（按 1 / 2 / 3 或點擊）', W / 2, 180, 26, '#ffd54f', 'center');
  choices.forEach((c, i) => {
    const r = cardRects[i];
    ctx.fillStyle = '#2b3145'; ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 2; ctx.strokeRect(r.x, r.y, r.w, r.h);
    text(String(i + 1), r.x + 14, r.y + 30, 20, '#ffd54f');
    text(c.name, r.x + r.w / 2, r.y + 75, 22, '#fff', 'center');
    text(c.desc, r.x + r.w / 2, r.y + 115, 15, '#cfd8dc', 'center');
  });
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawGrid();

  if (state === 'title') {
    text('小小倖存者', W / 2, H / 2 - 40, 56, '#ffd54f', 'center');
    text('WASD / 方向鍵移動，自動攻擊，撐越久越好', W / 2, H / 2 + 20, 20, '#cfd8dc', 'center');
    text('按 Enter 或點擊開始', W / 2, H / 2 + 70, 22, '#fff', 'center');
    return;
  }

  for (const g of gems) circle(g.x, g.y, g.v > 1 ? 7 : 5, '#4fc3f7');
  for (const e of enemies) {
    circle(e.x, e.y, e.r, e.flash > 0 ? '#ffffff' : e.color);
    if (e.r > 15) { // 大怪顯示血條
      ctx.fillStyle = '#000'; ctx.fillRect(e.x - 20, e.y - e.r - 10, 40, 4);
      ctx.fillStyle = '#e74c3c'; ctx.fillRect(e.x - 20, e.y - e.r - 10, 40 * e.hp / e.maxHp, 4);
    }
  }
  for (const b of bullets) circle(b.x, b.y, 4, '#ffd54f');
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life * 2.5); circle(p.x, p.y, 2.5, p.color); }
  ctx.globalAlpha = 1;

  // 玩家（受傷無敵時閃爍）
  if (!(player.inv > 0 && Math.floor(time * 20) % 2)) {
    circle(player.x, player.y, player.r, '#81c784');
    circle(player.x, player.y, player.r - 5, '#c8e6c9');
  }
  drawHud();

  if (state === 'levelup') drawLevelUp();
  if (state === 'dead') {
    ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H);
    text('你倒下了', W / 2, H / 2 - 40, 48, '#e74c3c', 'center');
    text(`存活 ${Math.floor(time)} 秒・等級 ${player.lvl}・擊殺 ${kills}`, W / 2, H / 2 + 10, 22, '#fff', 'center');
    text('按 Enter 或點擊重新開始', W / 2, H / 2 + 60, 20, '#cfd8dc', 'center');
  }
}

// ---------- 輸入 ----------
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k.startsWith('arrow')) e.preventDefault();
  if (state === 'levelup' && '123'.includes(k)) pick(Number(k) - 1);
  if ((state === 'title' || state === 'dead') && k === 'enter') reset();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

cv.addEventListener('click', e => {
  const rect = cv.getBoundingClientRect();
  const x = (e.clientX - rect.left) * W / rect.width, y = (e.clientY - rect.top) * H / rect.height;
  if (state === 'title' || state === 'dead') return reset();
  if (state === 'levelup') cardRects.forEach((r, i) => {
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) pick(i);
  });
});

// ---------- 主迴圈 ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state === 'play') update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
