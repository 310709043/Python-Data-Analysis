<title>枯林守夜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;700;900&display=swap">
<style>
/* Layout: full-bleed canvas world; HUD pinned to the four corners inside the safe areas; overlays centred. Single dark look by design. */
:root{
  --ink:#0a0b08; --soot:#15160f; --bark:#2a1f16; --bone:#d6cdb6; --ash:#8e8976; --moss:#66724f;
  --ember:#c4552f; --blood:#9a231c; --paper:#cdc1a1; --paper-ink:#2b2117;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU","SimSun",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);overflow:hidden;font-family:var(--f-body);-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none;touch-action:none;background:var(--ink)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.corner{position:absolute;display:flex;flex-direction:column;gap:6px}
.tl{top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px))}
.bl{bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:max(16px,env(safe-area-inset-left,0px));gap:8px}
.br{bottom:calc(env(safe-area-inset-bottom,0px) + 16px);right:max(16px,env(safe-area-inset-right,0px));align-items:flex-end}
.tr{top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px,env(safe-area-inset-right,0px));align-items:flex-end}
#day{font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.12em;color:var(--bone);text-shadow:0 2px 8px #000}
#phase{font-size:12px;letter-spacing:.3em;color:var(--ash)}
#clockbar{width:150px;height:3px;background:rgba(214,205,182,.12);position:relative}
#clockfill{position:absolute;left:0;top:0;bottom:0;background:var(--ash)}
#clockfill.night{background:var(--blood)}
.bar{display:grid;grid-template-columns:38px 150px;align-items:center;gap:8px;font-size:11px;letter-spacing:.2em;color:var(--ash)}
.bar i{display:block;height:5px;background:rgba(214,205,182,.1);position:relative;overflow:hidden}
.bar i b{position:absolute;left:0;top:0;bottom:0;background:var(--bone);transition:width .15s}
#hpb b{background:#a8392c}#stb b{background:#9b9778}#btb b{background:#c8b46a}
#inv{display:flex;flex-wrap:wrap;gap:4px 12px;max-width:min(560px,60vw);justify-content:flex-end;font-size:12px;color:var(--ash);letter-spacing:.05em}
#inv span{white-space:nowrap}#inv em{font-style:normal;color:var(--bone);font-variant-numeric:tabular-nums;margin-left:3px}
#inv span.zero{opacity:.38}
#weapon{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:.1em}
#weapon small{font-family:var(--f-body);font-size:11px;color:var(--ash);letter-spacing:.2em;margin-left:8px;font-weight:400}
#parts{font-size:12px;letter-spacing:.2em;color:var(--ash)}
#parts em{font-style:normal;color:#d9b35a}
#prompt{position:absolute;left:50%;top:64%;transform:translateX(-50%);font-size:14px;letter-spacing:.08em;color:var(--bone);text-shadow:0 1px 6px #000,0 0 2px #000;white-space:nowrap;text-align:center}
kbd{display:inline-block;min-width:1.4em;padding:1px 5px;margin:0 3px;border:1px solid rgba(214,205,182,.55);border-radius:3px;font-family:var(--f-body);font-size:12px;line-height:1.3;text-align:center;background:rgba(0,0,0,.4)}
#log{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18%);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(680px,90vw)}
#log div{font-family:var(--f-display);font-size:17px;letter-spacing:.12em;color:var(--bone);text-shadow:0 0 10px #000,0 2px 4px #000;text-align:center;text-wrap:balance;animation:logfade 6.5s ease forwards}
#log div.warn{color:#d77a5c}
@keyframes logfade{0%{opacity:0;transform:translateY(6px)}8%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
.ov{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;background:rgba(6,7,5,.66);overflow:auto}
#title{background:radial-gradient(ellipse at 50% 60%,rgba(6,7,5,.2),rgba(6,7,5,.88) 70%)}
.tcard{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;max-width:720px}
.tcard h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(56px,13vw,132px);letter-spacing:.24em;padding-left:.24em;line-height:1;color:var(--bone);text-shadow:0 0 30px rgba(0,0,0,.9),0 0 2px #000;animation:flick 7s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.35}94%{opacity:.9}96%{opacity:.5}97%{opacity:1}}
.tcard .sub{font-family:var(--f-display);font-size:16px;letter-spacing:.3em;color:var(--ash);margin:0}
.btn{pointer-events:auto;font-family:var(--f-display);font-size:18px;letter-spacing:.4em;padding:12px 28px 12px 34px;color:var(--bone);background:rgba(10,11,8,.5);border:1px solid rgba(214,205,182,.5);cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.btn:hover,.btn:focus-visible{background:rgba(154,35,28,.28);border-color:var(--ember);color:#fff;outline:none}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 28px;font-size:13px;color:var(--ash);text-align:left;letter-spacing:.04em}
.keys div{white-space:nowrap}
.tip{font-size:12px;letter-spacing:.35em;color:#6f6b5c;margin:0}
.paper{position:relative;width:min(520px,100%);box-sizing:border-box;padding:38px 42px 30px;background:
 radial-gradient(circle at 18% 22%,rgba(110,80,40,.22),transparent 30%),
 radial-gradient(circle at 82% 78%,rgba(90,60,30,.28),transparent 34%),
 radial-gradient(circle at 70% 12%,rgba(120,30,20,.12),transparent 18%),
 linear-gradient(176deg,#d3c7a7,#c2b48f);color:var(--paper-ink);font-family:var(--f-display);font-size:17px;line-height:2;letter-spacing:.06em;white-space:pre-line;transform:rotate(-1.2deg);box-shadow:0 20px 60px rgba(0,0,0,.8),inset 0 0 40px rgba(60,40,20,.35)}
.paper .close{display:block;margin-top:18px;font-family:var(--f-body);font-size:12px;letter-spacing:.2em;color:#6b5a44;text-align:right}
.panel{width:min(520px,100%);box-sizing:border-box;padding:26px 28px;background:linear-gradient(180deg,#221a12,#17120c);border:1px solid #3d2f22;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.panel h2{margin:0 0 4px;font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.3em}
.panel .hint{margin:14px 0 0;font-size:12px;letter-spacing:.2em;color:var(--ash)}
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:12px 0;border-bottom:1px solid #33271c}
.rec b{font-family:var(--f-display);font-size:17px;letter-spacing:.12em}
.rec span{grid-column:1;font-size:12px;color:var(--ash);letter-spacing:.06em}
.rec button{grid-row:1/3;grid-column:2;pointer-events:auto;font-family:var(--f-body);font-size:13px;letter-spacing:.2em;padding:8px 14px;color:var(--bone);background:transparent;border:1px solid #5a4632;cursor:pointer}
.rec button:hover,.rec button:focus-visible{border-color:var(--ember);outline:none}
.rec button:disabled{opacity:.35;cursor:not-allowed}
#mapov{background:rgba(6,7,5,.5);pointer-events:none}
#mapov .mapwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
#mapc{width:min(460px,86vw,70vh);height:auto;aspect-ratio:1;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.8);transform:rotate(.8deg)}
.end h1{font-size:clamp(40px,9vw,84px)!important;letter-spacing:.16em!important}
#dead h1{color:#b8372b}
#touch{position:fixed;inset:0;z-index:3;pointer-events:none}
#joy{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 110px);width:120px;height:120px;border-radius:50%;border:1px solid rgba(214,205,182,.25);background:rgba(0,0,0,.2)}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(214,205,182,.25)}
#tbtns{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 100px);display:grid;grid-template-columns:repeat(3,56px);gap:8px;pointer-events:auto}
#tbtns button{width:56px;height:56px;border-radius:50%;border:1px solid rgba(214,205,182,.35);background:rgba(10,11,8,.45);color:var(--bone);font-family:var(--f-body);font-size:13px}
#tbtns button.big{background:rgba(154,35,28,.35)}
@media (max-width:640px){
  #inv{max-width:70vw;font-size:11px}
  .bar{grid-template-columns:34px 110px}
  #log div{font-size:15px}
  .keys{grid-template-columns:1fr}
  .paper{padding:28px 24px;font-size:15px}
}
@media (prefers-reduced-motion:reduce){.tcard h1{animation:none}#log div{animation-duration:7s}}
</style>

<canvas id="game" aria-label="遊戲畫面"></canvas>

<div id="hud" hidden>
  <div class="corner tl">
    <div id="day">第一天</div>
    <div id="phase">白天</div>
    <div id="clockbar"><div id="clockfill"></div></div>
  </div>
  <div class="corner tr">
    <div id="parts">收音機零件 <em>0</em> / 3</div>
  </div>
  <div class="corner bl">
    <div class="bar" id="hpb">生命<i><b></b></i></div>
    <div class="bar" id="stb">體力<i><b></b></i></div>
    <div class="bar" id="btb">電池<i><b></b></i></div>
  </div>
  <div class="corner br">
    <div id="weapon">木棍</div>
    <div id="inv"></div>
  </div>
  <div id="prompt"></div>
  <div id="log"></div>
</div>

<div id="touch" hidden>
  <div id="joy"><div id="knob"></div></div>
  <div id="tbtns">
    <button data-a="g">照明</button><button data-a="q">繃帶</button><button data-a="m">地圖</button>
    <button data-a="f">手電</button><button data-a="e">互動</button><button data-a="atk" class="big">攻擊</button>
    <button data-a="sw">換武</button><button data-a="r">加固</button><button data-a="run">奔跑</button>
  </div>
</div>

<div id="title" class="ov">
  <div class="tcard">
    <h1>枯林守夜</h1>
    <p class="sub">白天，林子只是林子。</p>
    <button class="btn" id="startBtn">進入森林</button>
    <div class="keys">
      <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動</div>
      <div>滑鼠 瞄準・左鍵 攻擊</div>
      <div><kbd>Shift</kbd> 奔跑</div>
      <div><kbd>E</kbd> 互動・搜索・開門</div>
      <div><kbd>R</kbd> 加固或修復門</div>
      <div><kbd>F</kbd> 手電筒</div>
      <div><kbd>Q</kbd> 使用繃帶</div>
      <div><kbd>G</kbd> 丟照明彈</div>
      <div><kbd>1</kbd><kbd>2</kbd> 切換武器</div>
      <div><kbd>M</kbd> 地圖・<kbd>Esc</kbd> 暫停</div>
    </div>
    <p class="tip">戴上耳機　把燈關掉</p>
  </div>
</div>

<div id="noteov" class="ov" hidden><div class="paper" id="notetext"></div></div>

<div id="craft" class="ov" hidden>
  <div class="panel">
    <h2>工作台</h2>
    <div id="recipes"></div>
    <p class="hint"><kbd>E</kbd> 或 <kbd>Esc</kbd> 關閉</p>
  </div>
</div>

<div id="mapov" class="ov" hidden><div class="mapwrap"><canvas id="mapc" width="520" height="520"></canvas><p class="tip"><kbd>M</kbd> 收起地圖</p></div></div>

<div id="pause" class="ov" hidden>
  <div class="tcard">
    <h1 style="font-size:56px;animation:none">暫停</h1>
    <button class="btn" id="resumeBtn">繼續</button>
  </div>
</div>

<div id="dead" class="ov end" hidden>
  <div class="tcard">
    <h1>黑暗吞沒了你</h1>
    <p class="sub" id="deadsub"></p>
    <button class="btn" id="retryBtn">再試一次</button>
  </div>
</div>

<div id="win" class="ov end" hidden>
  <div class="tcard">
    <h1>天亮了</h1>
    <p class="sub" id="winsub"></p>
    <button class="btn" id="againBtn">再玩一次</button>
  </div>
</div>

<script>
(()=>{
'use strict';
// ================= UTIL =================
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rr=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rr(a,b+1));
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function angDiff(a,b){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);

// ================= CANVAS =================
const cv=$('game'), ctx=cv.getContext('2d');
const dk=document.createElement('canvas'), dctx=dk.getContext('2d');
let hasFilter=('filter' in dctx);let perfAcc=0,perfN=0;
let W=0,H=0,DPR=1,Z=1,vign=null;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  dk.width=Math.max(2,Math.round(W*DPR*.5));dk.height=Math.max(2,Math.round(H*DPR*.5));
  Z=clamp(Math.min(W,H)/680,.62,1.45);
  vign=document.createElement('canvas');vign.width=cv.width;vign.height=cv.height;
  const v=vign.getContext('2d');
  const g=v.createRadialGradient(cv.width/2,cv.height/2,Math.min(cv.width,cv.height)*.22,cv.width/2,cv.height/2,Math.hypot(cv.width,cv.height)*.56);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.6,'rgba(0,0,0,.35)');g.addColorStop(1,'rgba(0,0,0,.92)');
  v.fillStyle=g;v.fillRect(0,0,vign.width,vign.height);
}
addEventListener('resize',resize);resize();
function setCam(c,s,cx,cy){c.setTransform(Z*s,0,0,Z*s,(W/2-cx*Z)*s,(H/2-cy*Z)*s);}

// ground texture
const groundPat=(()=>{
  const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');
  g.fillStyle='#1a1d14';g.fillRect(0,0,512,512);
  const R=mulberry32(7);
  for(let i=0;i<260;i++){const x=R()*512,y=R()*512,r=20+R()*70;const gr=g.createRadialGradient(x,y,0,x,y,r);
    const c1=R()<.5?'rgba(34,40,24,':'rgba(20,22,15,';gr.addColorStop(0,c1+(.25+R()*.3)+')');gr.addColorStop(1,c1+'0)');g.fillStyle=gr;
    for(const ox of[-512,0,512])for(const oy of[-512,0,512]){g.beginPath();g.arc(x+ox,y+oy,r,0,TAU);g.fill();}}
  for(let i=0;i<5200;i++){const x=R()*512,y=R()*512;g.fillStyle=R()<.5?'rgba(50,54,36,.5)':'rgba(10,12,8,.55)';g.fillRect(x,y,1+R()*1.5,1+R()*1.5);}
  g.lineWidth=.8;
  for(let i=0;i<900;i++){const x=R()*512,y=R()*512,a=R()*TAU,l=3+R()*6;g.strokeStyle=R()<.6?'rgba(64,52,34,.45)':'rgba(40,48,28,.5)';g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
  return ctx.createPattern(c,'repeat');
})();
// film grain frames
const grains=[0,1,2,3].map(()=>{const c=document.createElement('canvas');c.width=c.height=192;const g=c.getContext('2d');const im=g.createImageData(192,192);
  for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=Math.random()<.5?22:0;}g.putImageData(im,0,0);return ctx.createPattern(c,'repeat');});

// ================= INPUT =================
const keys={},pressed={};
const mouse={x:innerWidth/2,y:innerHeight/2-80,down:false,clicked:false};
let touchMode=false;
addEventListener('keydown',e=>{
  const k=e.code;if(!keys[k])pressed[k]=true;keys[k]=true;
  if(['Space','Tab','ArrowUp','ArrowDown'].includes(k))e.preventDefault();
  onKey(k);
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false;});
cv.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
cv.addEventListener('mousedown',e=>{if(e.button===0){mouse.down=true;mouse.clicked=true;}});
addEventListener('mouseup',()=>{mouse.down=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
// touch
const T={id:null,ox:0,oy:0,jx:0,jy:0,active:false,atk:false,run:false};
function enableTouch(){if(touchMode)return;touchMode=true;$('touch').hidden=G.state!=='play';}
cv.addEventListener('touchstart',e=>{enableTouch();for(const t of e.changedTouches){if(t.clientX<W*.5&&T.id===null){T.id=t.identifier;T.ox=t.clientX;T.oy=t.clientY;T.active=true;}}e.preventDefault();},{passive:false});
cv.addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(t.identifier===T.id){let dx=(t.clientX-T.ox)/50,dy=(t.clientY-T.oy)/50;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}T.jx=dx;T.jy=dy;$('knob').style.transform=`translate(${dx*40}px,${dy*40}px)`;}}e.preventDefault();},{passive:false});
const tEnd=e=>{for(const t of e.changedTouches){if(t.identifier===T.id){T.id=null;T.active=false;T.jx=T.jy=0;$('knob').style.transform='';}}};
cv.addEventListener('touchend',tEnd);cv.addEventListener('touchcancel',tEnd);
document.querySelectorAll('#tbtns button').forEach(b=>{
  const a=b.dataset.a;
  b.addEventListener('touchstart',e=>{e.preventDefault();enableTouch();
    if(a==='atk')T.atk=true;else if(a==='run')T.run=!T.run,b.style.borderColor=T.run?'#c4552f':'';
    else{const map={e:'KeyE',f:'KeyF',q:'KeyQ',g:'KeyG',m:'KeyM',r:'KeyR',sw:'SWAP'};pressed[map[a]]=true;onKey(map[a]);}
  },{passive:false});
  b.addEventListener('touchend',e=>{e.preventDefault();if(a==='atk')T.atk=false;},{passive:false});
});

// ================= AUDIO =================
const AU={on:false};
function audioInit(){
  if(AU.on)return;
  const A=new(window.AudioContext||window.webkitAudioContext)();AU.A=A;
  const master=A.createGain();master.gain.value=.9;
  const comp=A.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;
  master.connect(comp);comp.connect(A.destination);AU.master=master;
  const len=A.sampleRate*3.6|0,ir=A.createBuffer(2,len,A.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);}
  const conv=A.createConvolver();conv.buffer=ir;const rg=A.createGain();rg.gain.value=.55;conv.connect(rg);rg.connect(master);AU.rev=conv;
  const nb=A.createBuffer(1,A.sampleRate*2,A.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;AU.noise=nb;
  const bb=A.createBuffer(1,A.sampleRate*4,A.sampleRate),bd=bb.getChannelData(0);let last=0;for(let i=0;i<bd.length;i++){last=(last+.02*(Math.random()*2-1))/1.02;bd[i]=last*3.5;}
  const loop=(buf)=>{const s=A.createBufferSource();s.buffer=buf;s.loop=true;s.start();return s;};
  // wind
  const w=loop(bb);const wf=A.createBiquadFilter();wf.type='bandpass';wf.frequency.value=420;wf.Q.value=.6;const wg=A.createGain();wg.gain.value=0;
  w.connect(wf);wf.connect(wg);wg.connect(master);AU.windF=wf;AU.windG=wg;
  const w2=loop(bb);const wf2=A.createBiquadFilter();wf2.type='lowpass';wf2.frequency.value=140;const wg2=A.createGain();wg2.gain.value=.25;w2.connect(wf2);wf2.connect(wg2);wg2.connect(master);
  // drone

function nightness(c){if(c<190)return 0;if(c<225)return(c-190)/35;if(c<345)return 1;return 1-(c-345)/15;}

function advanceClock(dt){
  const prev=G.clock;G.clock+=dt;
  const cross=v=>prev<v&&G.clock>=v;
  if(cross(165))msg('太陽快下山了。回到小屋去。',true);
  if(cross(190)){msg('黃昏。林子安靜得不對勁。');if(!P.flash)setTimeout(()=>msg('按 F 打開手電筒。'),2000);sfx('howl',P.x+700,P.y-500,.9,.6,1800);

  if(cross(225)){msg('夜晚降臨。',true);sfx('boom',null,null,.8,.6);G.spawnT=8;if(!inCabin(P.x,P.y))setTimeout(()=>msg('你還在外面。',true),2200);}
  if(cross(345)){msg('天要亮了。');for(const e of enemies)if(e.type!=='dog')e.retreat=true;}

    G.day++;G.survived++;G.raining=false;msg(`第${CN[G.day]||G.day}天。你又撐過了一夜。`);
    for(const e of enemies)if(e.type!=='dog')e.retreat=true;

}

function updPlayer(dt){

  const moving=ml>.12;

  const sprint=(keys.ShiftLeft||keys.ShiftRight||T.run)&&moving&&P.st>4;
  let spd=sprint?205:118;if(P.bandT>0)spd*=.45;if(inBush(P.x,P.y))spd*=.6;

  if(sprint){P.st=Math.max(0,P.st-24*dt);P.stDelay=.7;}else{P.stDelay-=dt;if(P.stDelay<=0)P.st=Math.min(100,P.st+26*dt);}
  if(moving){P.walkPh+=dt*(sprint?14:9);P.stepT-=dt;if(P.stepT<=0){P.stepT=sprint?.29:.43;const wood=inCabin(P.x,P.y);sfx('step',null,null,sprint?.55:.32,.08,null,wood);if(sprint)makeNoise(P.x,P.y,340);}}

  if(!touchMode){const wx=camX+(mouse.x-W/2)/Z,wy=camY+(mouse.y-H/2)/Z;P.aim=Math.atan2(wy-P.y,wx-P.x);}
  else if(moving&&!T.atk)P.aim+=angDiff(P.aim,Math.atan2(my,mx))*Math.min(1,dt*9);
  else if(T.atk){const e=nearestEnemy(150);if(e)P.aim+=angDiff(P.aim,Math.atan2(e.y-P.y,e.x-P.x))*Math.min(1,dt*12);}
  // timers
  P.swingT=Math.max(0,P.swingT-dt);P.swingCd-=dt;P.gunCd-=dt;P.bandT=Math.max(0,P.bandT-dt);
  if(mouse.down||T.atk)attack();
  // flashlight
  const n=nightness(G.clock);
  if(P.flash&&P.battery>0){P.battery=Math.max(0,P.battery-(n>.3?.75:.15)*dt);
    if(P.battery<=0){if(INV.battery>0){INV.battery--;P.battery=100;msg('換上新電池。');sfx('click',null,null,.6);}else{msg('手電筒沒電了。',true);P.flash=false;}}}
  P.flick=P.flash&&P.battery<18&&Math.random()<.08?.12:Math.max(0,P.flick-dt);

    if(P.searchT>=1.35)finishSearch(P.searching);}
  // regen in cabin by day
  if(inCabin(P.x,P.y)&&n<.1&&P.hp<100)P.hp=Math.min(100,P.hp+.5*dt);
  // breath at night
  if(n>.5){P.breathT-=dt;if(P.breathT<=0){P.breathT=rr(2.2,3.6);for(let i=0;i<6;i++)parts.push({x:P.x+Math.cos(P.aim)*12,y:P.y+Math.sin(P.aim)*12,vx:Math.cos(P.aim)*rr(10,22)+rr(-6,6),vy:Math.sin(P.aim)*rr(10,22)+rr(-6,6),life:rr(1,1.6),max:1.6,sz:rr(3,6),k:'breath'});}}
}

let focus=null;
function findFocus(){
  focus=null;let best=1e9;

    if(it.kind==='cont'&&it.cont.searched)continue;
    const d=dist(P.x,P.y,it.x,it.y);if(d>it.reach)continue;
    const a=Math.atan2(it.y-P.y,it.x-P.x);const sc=d-18*Math.cos(angDiff(P.aim,a));

function focusLabel(it){
  if(!it)return'';

    case'cont':return P.searching===it.cont?'搜索中…':`<kbd>E</kbd>${it.cont.label}`;
    case'note':return`<kbd>E</kbd>閱讀紙條`;
    case'bench':return`<kbd>E</kbd>使用工作台`;
    case'gen':return`<kbd>E</kbd>加入燃料　<span style="color:#8e8976">剩餘 ${Math.ceil(G.genFuel)} 秒・燃料 ${INV.fuel}</span>`;
    case'radio':{const n=Object.values(P.parts).filter(Boolean).length;return G.radioFixed?'收音機只剩下沙沙聲。':`<kbd>E</kbd>修理收音機　<span style="color:#8e8976">零件 ${n}/3</span>`;}
    case'door':{const d=it.door;if(d.broken)return`門被撞壞了　<kbd>R</kbd>修復（木材 2・廢鐵 1）`;
      return`<kbd>E</kbd>${d.open?'關門':'開門'}`+(d.hp<200?`　<kbd>R</kbd>加固（木材 1）`:'')+`　<span style="color:#8e8976">${Math.round(d.hp)}</span>`;}
  }return'';
}
function interact(){
  if(!focus)return;const it=focus;

    case'cont':P.searching=it.cont;P.searchT=0;break;

    case'bench':openCraft();break;
    case'gen':if(INV.fuel>0){INV.fuel--;G.genFuel+=110;sfx('drip',121,-80,.7);msg('你把燃料倒進發電機。');}else msg('你沒有燃料。');break;
    case'radio':fixRadio();break;

function reinforce(){
  if(!focus||focus.kind!=='door')return;const d=focus.door;

  if(k==='KeyE')interact();

const TYPES={dog:{r:11,hp:34,speed:168,dmg:9,cd:.85},crawler:{r:11,hp:46,speed:128,dmg:13,cd:.8},hollow:{r:13,hp:120,speed:150,dmg:28,cd:1.5},watcher:{r:12,hp:999,speed:0,dmg:0,cd:9}};
function spawnEnemy(type,x,y){const t=TYPES[type];const e={type,x,y,r:t.r,hp:t.hp,ang:Math.atan2(P.y-y,P.x-x),t:Math.random()*10,atkCd:1,stagger:0,kx:0,ky:0,side:Math.random()<.5?1:-1,stuck:0,sndT:rr(1,4),vis:false,seenT:0,aggro:type!=='dog'||nightness(G.clock)>.5,wa:Math.random()*TAU,alpha:0,lunge:0,lungeCd:rr(1,2.5),retreat:false,life:7,dphase:0,door:null,spdNow:0,firstSeen:false};enemies.push(e);return e;}
function findSpawn(minD,maxD){
  for(let i=0;i<40;i++){const a=Math.random()*TAU,d=rr(minD,maxD),x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d;
    if(Math.abs(x)>WORLD-80||Math.abs(y)>WORLD-80)continue;if(inCabin(x,y)||dist(x,y,0,0)<200)continue;if(solidAt(x,y,14))continue;

    return{x,y};}return null;}
const outPt=d=>({x:d.cx+d.nx*30,y:d.cy+d.ny*30}),inPt=d=>({x:d.cx-d.nx*30,y:d.cy-d.ny*30});
function updEnemy(e,dt){
  e.t+=dt;e.atkCd-=dt;e.stagger-=dt;e.alpha=Math.min(1,e.alpha+dt*2);
  const pcone=pip(e.x,e.y,V.cone),pnear=pip(e.x,e.y,V.near);e.vis=pcone||pnear;e.inCone=pcone;
  if(e.vis){e.seenT+=dt;if(!e.firstSeen){e.firstSeen=true;const d=dist(P.x,P.y,e.x,e.y);if(nightness(G.clock)>.4&&d<330&&e.type!=='dog'&&Math.random()<.6){sfx('stinger',e.x,e.y,.55,.6);G.fear=Math.min(1,G.fear+.35);}}}else e.seenT=0;
  const d=dist(P.x,P.y,e.x,e.y);
  if(e.type==='watcher'){e.life-=dt;e.ang=Math.atan2(P.y-e.y,P.x-e.x);
    if(e.seenT>.42){e.dead=true;sfx('stinger',e.x,e.y,.8,.7);G.fear=Math.min(1,G.fear+.6);for(let i=0;i<14;i++)parts.push({x:e.x+rr(-8,8),y:e.y+rr(-8,8),vx:rr(-30,30),vy:rr(-30,30),life:rr(.5,1.2),max:1.2,sz:rr(4,9),k:'smoke'});}
    if(e.life<=0)e.dead=true;return;}
  if(d>1500){e.dead=true;return;}
  // sounds
  e.sndT-=dt;if(e.sndT<=0){e.sndT=rr(2.5,6);sfx({dog:Math.random()<.5?'growl':'bark',crawler:'clicks',hollow:'groan'}[e.type],e.x,e.y,e.type==='hollow'?.9:.8,.4,1000);}
  let spd=TYPES[e.type].speed;let tx=P.x,ty=P.y,doorT=null,flee=null;

  else{
    const pin=inCabin(P.x,P.y),ein=inCabin(e.x,e.y);
    if(pin!==ein){
      if(!e.door||e.doorSide!==ein){let best=null,bd=1e9;for(const dd of doors){const A=ein?inPt(dd):outPt(dd);const q=dist(e.x,e.y,A.x,A.y);if(q<bd){bd=q;best=dd;}}e.door=best;e.doorSide=ein;e.dphase=0;}
      const dd=e.door,A=ein?inPt(dd):outPt(dd),B=ein?outPt(dd):inPt(dd);
      if(e.dphase===0){tx=A.x;ty=A.y;if(dist(e.x,e.y,A.x,A.y)<22)e.dphase=1;}

    }else e.door=null;
    // light aversion

    if(flee){const a=Math.atan2(e.y-flee.y,e.x-flee.x);tx=e.x+Math.cos(a)*100;ty=e.y+Math.sin(a)*100;doorT=null;}
    if(e.type==='dog'&&!e.aggro){if(d<300&&los(e.x,e.y,P.x,P.y))e.aggro=true;e.wa+=rr(-1.5,1.5)*dt;tx=e.x+Math.cos(e.wa)*60;ty=e.y+Math.sin(e.wa)*60;spd=55;if(Math.random()<dt*.3)sfx('growl',e.x,e.y,.5,.3);}
    if(e.type==='crawler'){e.lungeCd-=dt;if(e.lunge>0){e.lunge-=dt;spd*=1.95;}else if(d<170&&e.lungeCd<=0&&!doorT){e.lunge=.45;e.lungeCd=rr(1.6,2.6);sfx('clicks',e.x,e.y,1,.3);}}
    if(e.type==='hollow'){if(e.inCone&&!e.retreat){spd=0;if(d<380)G.fearAdd=(G.fearAdd||0)+.5;}else spd=d<220?95:150;}
  }
  if(e.type==='hollow'&&!e.retreat){
    if(e.inCone)doorT=null;
    if(lamp.on){const LR=lamp.radius*.8,dl=dist(e.x,e.y,lamp.x,lamp.y);
      if(dl<LR-4){doorT=null;const a=Math.atan2(e.y-lamp.y,e.x-lamp.x);tx=e.x+Math.cos(a)*80;ty=e.y+Math.sin(a)*80;if(!e.inCone)spd=Math.max(spd,70);}
      else{const a=Math.atan2(ty-e.y,tx-e.x);if(dist(e.x+Math.cos(a)*spd*.25,e.y+Math.sin(a)*spd*.25,lamp.x,lamp.y)<LR){doorT=null;spd=0;}}}}
  if(e.stagger>0)spd*=.15;
  e.spdNow=spd;
  // door attack
  if(doorT){const dd=dist(e.x,e.y,doorT.cx,doorT.cy);
    if(dd<e.r+22){e.ang+=angDiff(e.ang,Math.atan2(doorT.cy-e.y,doorT.cx-e.x))*Math.min(1,dt*8);
      if(e.atkCd<=0){e.atkCd=TYPES[e.type].cd*1.3;const dm={dog:7,crawler:11,hollow:30}[e.type];doorT.hp-=dm;sfx('bang',doorT.cx,doorT.cy,1,.5,1200);if(dist(P.x,P.y,doorT.cx,doorT.cy)<260)G.shake=Math.max(G.shake,5);
        if(Math.random()<.25)msg('有東西在撞門！',true);
        if(doorT.hp<=0){doorT.hp=0;doorT.broken=true;doorT.open=false;updDoor(doorT);sfx('crack',doorT.cx,doorT.cy,1,.5,1400);msg('門被撞開了！',true);G.fear=1;}}
      return;}
    moveStraight(e,Math.atan2(doorT.cy-e.y,doorT.cx-e.x),spd,dt);return;}
  let ang=Math.atan2(ty-e.y,tx-e.x);
  if(e.type==='crawler'&&e.lunge<=0)ang+=Math.sin(e.t*6.5)*.55;
  if(spd>0)steerMove(e,ang,spd,dt);
  // separation
  for(const o of enemies){if(o===e||o.dead||o.type==='watcher')continue;const dx=e.x-o.x,dy=e.y-o.y,m=e.r+o.r;const q=dx*dx+dy*dy;if(q<m*m&&q>.01){const dd=Math.sqrt(q);e.x+=dx/dd*(m-dd)*.5;e.y+=dy/dd*(m-dd)*.5;}}
  e.x+=e.kx*dt;e.y+=e.ky*dt;e.kx*=Math.pow(.01,dt);e.ky*=Math.pow(.01,dt);collide(e);
  // attack player
  if(!e.retreat&&e.aggro&&d<e.r+P.r+7&&e.atkCd<=0&&e.stagger<=0&&!flee){
    if(e.type==='hollow'&&e.inCone)return;

    if(e.type!=='hollow'){const a=Math.atan2(e.y-P.y,e.x-P.x);e.kx=Math.cos(a)*160;e.ky=Math.sin(a)*160;}
  }
}
function moveStraight(e,a,spd,dt){e.ang+=angDiff(e.ang,a)*Math.min(1,dt*10);e.x+=Math.cos(e.ang)*spd*dt;e.y+=Math.sin(e.ang)*spd*dt;collide(e);}
const TRIES=[0,.5,-.5,1,-1,1.6,-1.6,2.3,-2.3];
function steerMove(e,ang,spd,dt){

function hurtEnemy(e,dmg,kx,ky){

function spawners(dt){

// ================= PARTICLES / FLARES / FOG =================
let parts=[];const fog=[];for(let i=0;i<22;i++)fog.push({x:rr(-800,800),y:rr(-800,800),r:rr(140,320),vx:rr(-10,10),vy:rr(-6,6),p:Math.random()*TAU});
const rain=[];for(let i=0;i<180;i++)rain.push({x:Math.random(),y:Math.random(),s:rr(.8,1.4)});
function updParts(dt){

    if(p.life<=0&&p.k==='blood'&&Math.random()<.35){blood.push({x:p.x,y:p.y,r:p.sz*1.3,a:0,c:p.c});}}
  parts=parts.filter(p=>p.life>0);if(parts.length>600)parts.splice(0,parts.length-600);
  for(const f of flares){f.life-=dt;if(!f.land){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=Math.pow(.05,dt);f.vy*=Math.pow(.05,dt);const ox=f.x,oy=f.y;collide(f);if(ox!==f.x||oy!==f.y){f.vx*=-.4;f.vy*=-.4;}
      if(Math.hypot(f.vx,f.vy)<25){f.land=true;f.radius=280;castRays(f.x,f.y,0,TAU,120,f.radius,false,f.pts);f.path=polyPath(f.pts,new Path2D());}}
    if(Math.random()<dt*20)parts.push({x:f.x,y:f.y,vx:rr(-15,15),vy:rr(-40,-10),life:rr(.4,1),max:1,sz:rr(1,2),k:'ember'});}
  flares=flares.filter(f=>f.life>0);
  for(const c of corpses)c.t-=dt;corpses=corpses.filter(c=>c.t>0);
  for(const f of fog){f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.x-P.x>900)f.x-=1800;if(P.x-f.x>900)f.x+=1800;if(f.y-P.y>700)f.y-=1400;if(P.y-f.y>700)f.y+=1400;}

}

// ================= AMBIENT AUDIO =================
function ambience(dt){
  if(!AU.on)return;const A=AU.A,t=A.currentTime,n=nightness(G.clock);const play=G.state==='play';
  AU.windG.gain.setTargetAtTime(.14+.1*Math.sin(G.time*.13)+.06*Math.sin(G.time*.41)+(G.raining?.06:0),t,.5);
  AU.windF.frequency.setTargetAtTime(380+180*Math.sin(G.time*.09)+120*Math.sin(G.time*.31),t,.6);
  AU.droneG.gain.setTargetAtTime(play?.03+n*.1+G.fear*.12:.09,t,.8);
  AU.droneF.frequency.setTargetAtTime(130+G.fear*260,t,.5);
  AU.rainG.gain.setTargetAtTime(G.raining&&n>.2?.13*(inCabin(P.x,P.y)?.6:1):0,t,1.5);
  const gOn=lamp.on;AU.genG.gain.setTargetAtTime(gOn?.09*Math.pow(clamp(1-dist(P.x,P.y,121,-85)/600,0,1),1.5):0,t,.3);
  if(AU.genPan)AU.genPan.pan.setTargetAtTime(clamp((121-P.x)/380,-1,1),t,.1);
  if(!play)return;
  G.hbT-=dt;const hb=Math.max(G.fear,P.hp<35?.55:0);if(hb>.3&&G.hbT<=0){G.hbT=1.15-hb*.55;sfx('heart',null,null,clamp(hb,.3,1)*.9,.05);}
  G.ambT-=dt;if(G.ambT>0)return;
  const rp=(a,b)=>{const ang=Math.random()*TAU,d=rr(a,b);return[P.x+Math.cos(ang)*d,P.y+Math.sin(ang)*d];};
  const r=Math.random();
  if(n<.3){G.ambT=rr(7,15);if(r<.45){const[x,y]=rp(500,800);sfx('caw',x,y,.6,.6,1600);}else if(r<.75){const[x,y]=rp(250,500);sfx('snap',x,y,.8,.4);}else{const[x,y]=rp(300,600);sfx('creak',x,y,.6,.5,1200);}}
  else{G.ambT=rr(3.5,8);const ins=inCabin(P.x,P.y);
    if(r<.22){const[x,y]=rp(700,1000);sfx('howl',x,y,1,.7,1900);}
    else if(r<.46){const[x,y]=rp(200,420);sfx('snap',x,y,.9,.4);}
    else if(r<.62&&(G.fear>.2||!ins)){const a=P.aim+Math.PI+rr(-.8,.8);sfx('whisper',P.x+Math.cos(a)*120,P.y+Math.sin(a)*120,.55,.4);}
    else if(r<.76&&ins){const d=doors[Math.random()*2|0];if(d.solid){sfx('knock',d.cx+d.nx*20,d.cy+d.ny*20,1,.4);if(!G.knockDone){G.knockDone=true;setTimeout(()=>msg('門外有人在叫你的名字。',true),900);}}}
    else if(r<.86){const[x,y]=rp(600,900);sfx('scream',x,y,.5,.8,1600);}
    else{const[x,y]=rp(200,500);sfx('creak',x,y,.7,.5);}}
}

// ================= UPDATE =================
function update(dt){
  G.time+=dt;
  if(G.state==='title'){G.clock=262;P.x=Math.sin(G.time*.06)*150+20;P.y=420+Math.cos(G.time*.045)*110;P.aim=-Math.PI/2+Math.sin(G.time*.23)*.9;P.flash=true;P.battery=100;P.flick=0;
    camX=P.x+Math.cos(P.aim)*120;camY=P.y+Math.sin(P.aim)*120;lamp.on=true;computeVision();updLights(dt);updParts(dt);ambience(dt);G.fear=.1;return;}
  if(G.state!=='play'){computeVision();return;}
  if(G.overlay&&G.overlay!=='mapov'){computeVision();return;}
  advanceClock(dt);if(G.state!=='play')return;
  updPlayer(dt);
  // camera
  const ld=touchMode?110:Math.min(220,Math.hypot(mouse.x-W/2,mouse.y-H/2)/Z)*.32;
  camX+=(P.x+Math.cos(P.aim)*ld-camX)*Math.min(1,dt*6);camY+=(P.y+Math.sin(P.aim)*ld-camY)*Math.min(1,dt*6);
  updLights(dt);
  computeVision();
  G.fearAdd=0;
  for(const e of enemies)if(!e.dead)updEnemy(e,dt);
  enemies=enemies.filter(e=>!e.dead);
  spawners(dt);updParts(dt);
  // fear
  const n=nightness(G.clock);let ft=0;
  for(const e of enemies){if(e.type==='watcher'||e.retreat)continue;const d=dist(P.x,P.y,e.x,e.y);if(d<320)ft=Math.max(ft,(1-d/320)*(e.vis?.75:1));}
  if(n>.5&&!inCabin(P.x,P.y))ft+=.18;if(n>.5&&!(P.flash&&P.battery>0))ft+=.12;ft+=G.fearAdd||0;
  ft=clamp(ft,0,1);G.fear+=(ft-G.fear)*Math.min(1,dt*(ft>G.fear?2:.4));
  G.shake=Math.max(0,G.shake-dt*30);G.dmg=Math.max(0,G.dmg-dt*1.6);G.muzzle=Math.max(0,G.muzzle-dt);
  // lightning
  if(G.raining&&n>.6){G.lightningT-=dt;if(G.lightningT<=0){G.lightningT=rr(12,28);G.lightning=.55;setTimeout(()=>sfx('thunder',null,null,.9,.5),rr(500,1800));
    if(Math.random()<.7){const a=P.aim+rr(-1.2,1.2)+(Math.random()<.4?Math.PI:0),d=rr(220,420);G.flashFig={x:P.x+Math.cos(a)*d,y:P.y+Math.sin(a)*d};}else G.flashFig=null;}}
  G.lightning=Math.max(0,G.lightning-dt);
  // exploration & landmark discovery
  G.exploreT-=dt;if(G.exploreT<=0){G.exploreT=.3;const cx=Math.floor((P.x+WORLD)/97.5),cy=Math.floor((P.y+WORLD)/97.5);
    for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++){if(i*i+j*j>10)continue;const x=cx+i,y=cy+j;if(x>=0&&y>=0&&x<40&&y<40)explored[y*40+x]=1;}
    for(const k in LM){const l=LM[k];if(!l.found&&dist(P.x,P.y,l.x,l.y)<260){l.found=true;}}}
  if(!G.roadMsg&&P.x>1560&&Math.abs(P.y-150)<140){G.roadMsg=true;msg('出山的路被倒下的樹封死了。');setTimeout(()=>msg('樹幹上刻滿了指甲的抓痕。'),2600);}
  findFocus();
  pressedClear();
}
function pressedClear(){for(const k in pressed)delete pressed[k];mouse.clicked=false;}
function updLights(dt){
  const n=nightness(G.clock);
  const on=G.state==='title'?true:(G.genFuel>0&&n>.03);
  if(G.state==='play'){if(on)G.genFuel=Math.max(0,G.genFuel-dt);
    if(G.lampWasOn&&!on&&n>.3){msg('發電機停了。燈滅了。',true);sfx('creak',121,-85,.8);}G.lampWasOn=on;
    if(on&&G.genFuel<15&&!G.warned.fuel){G.warned.fuel=true;msg('發電機的燃料快用完了。');}if(G.genFuel>20)G.warned.fuel=false;}
  lamp.on=on;lamp.flick=on?(G.genFuel<12&&G.state==='play'&&Math.random()<.12?.45:1-Math.random()*.06):0;
  if(G.lightsDirty){castRays(lamp.x,lamp.y,0,TAU,220,lamp.radius,false,lamp.pts);lamp.path=polyPath(lamp.pts,new Path2D());G.lightsDirty=false;}
}
function computeVision(){
  const n=G.state==='title'?1:nightness(G.clock);
  const fl=P.flash&&P.battery>0&&P.flick<=0;
  V.range=lerp(640,fl?500:155,n);const half=lerp(.78,fl?.46:.85,n);V.cut=lerp(1,fl?1:.62,n);
  V.nearR=lerp(110,78,n);
  castRays(P.x,P.y,P.aim-half,P.aim+half,150,V.range,true,V.cone);
  castRays(P.x,P.y,0,TAU,64,V.nearR,false,V.near);
  V.conePath=polyPath(V.cone,new Path2D());V.nearPath=polyPath(V.near,new Path2D());
  V.path=new Path2D();V.path.addPath(V.conePath);V.path.addPath(V.nearPath);
}

const LOW=new Set(['rock','bench','gen','radio','bed','table','shelf','well','lantern','log','scare']);

function drawBush(o){

function renderDarkness(n){

  const r=lerp(14,2,n)|0,g=lerp(16,3,n)|0,b=lerp(12,8,n)|0;
  dctx.fillStyle=`rgba(${r},${g},${b},${a})`;dctx.fillRect(0,0,dk.width,dk.height);
  dctx.globalCompositeOperation='destination-out';setCam(dctx,s,G.cx,G.cy);

  if(lamp.on&&lamp.path)light(lamp,lamp.flick);
  if(n>.2||G.state==='title')for(const c of candles)light(c,.9+Math.random()*.12);
  for(const f of flares)if(f.land)light(f,clamp(f.life/6,0,1)*(.9+Math.random()*.15));else{const q=dctx.createRadialGradient(f.x,f.y,2,f.x,f.y,90);q.addColorStop(0,'rgba(0,0,0,.9)');q.addColorStop(1,'rgba(0,0,0,0)');dctx.fillStyle=q;circAt(dctx,f.x,f.y,90);}

  for(const f of flares){ctx.fillStyle='#ff6a3a';circ(f.x,f.y,2.5);ctx.fillStyle='#3a1a10';ctx.fillRect(f.x-5,f.y-1.5,7,3);}

  for(const f of flares)if(f.land){f.col=[255,70,40];glow(f,f.col,.3*clamp(f.life/6,0,1)*(.85+Math.random()*.2),f.radius);}
  if(n>.3&&P.flash&&P.battery>0&&P.flick<=0){const g=ctx.createRadialGradient(P.x,P.y,10,P.x,P.y,V.range);g.addColorStop(0,'rgba(255,236,190,.09)');g.addColorStop(1,'rgba(255,236,190,0)');ctx.fillStyle=g;ctx.fill(V.conePath);}
  if(G.muzzle>0){const g=ctx.createRadialGradient(P.x,P.y,2,P.x,P.y,120);g.addColorStop(0,'rgba(255,210,140,.6)');g.addColorStop(1,'rgba(255,210,140,0)');ctx.fillStyle=g;circ(P.x,P.y,120);}
  for(const p of parts){if(p.k!=='dust'&&p.k!=='ember'&&p.k!=='spark')continue;const a=clamp(p.life/p.max,0,1);
    if(p.k==='dust'){if(!pip(p.x,p.y,V.cone))continue;ctx.fillStyle=`rgba(255,240,200,${a*.35})`;}else if(p.k==='ember')ctx.fillStyle=`rgba(255,120,60,${a})`;else ctx.fillStyle=`rgba(255,220,150,${a})`;circ(p.x,p.y,p.sz);}
  if(G.tracer){ctx.strokeStyle=`rgba(255,220,160,${G.tracer.t*8})`;ctx.lineWidth=1.5;ln(G.tracer.x1,G.tracer.y1,G.tracer.x2,G.tracer.y2);}
  ctx.globalCompositeOperation='source-over';
  // red eyes in the dark
  if(n>.5)for(const e of enemies){if(e.vis||(e.type!=='hollow'&&e.type!=='crawler')||e.retreat)continue;const d=dist(P.x,P.y,e.x,e.y);if(d>620)continue;
    if(Math.sin(e.t*1.3+e.x)>.86)continue;if(!los(P.x,P.y,e.x,e.y))continue;
    const hx=e.x+Math.cos(e.ang)*(e.type==='hollow'?3:13),hy=e.y+Math.sin(e.ang)*(e.type==='hollow'?3:13),px=-Math.sin(e.ang)*2.6,py=Math.cos(e.ang)*2.6;
    ctx.fillStyle=`rgba(200,30,20,${.65*(1-d/700)*e.alpha})`;circ(hx+px,hy+py,1.3);circ(hx-px,hy-py,1.3);}
  // lightning silhouettes
  if(G.lightning>0&&(G.lightning>.4||(G.lightning>.15&&G.lightning<.25))){for(const e of enemies)drawEnemy(e,true);
    if(G.flashFig)drawEnemy({type:'watcher',x:G.flashFig.x,y:G.flashFig.y,ang:Math.atan2(P.y-G.flashFig.y,P.x-G.flashFig.x),t:0,spdNow:0,alpha:1},true);}
  // search ring
  if(P.searching){ctx.strokeStyle='rgba(214,205,182,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(P.x,P.y,22,-Math.PI/2,-Math.PI/2+TAU*clamp(P.searchT/1.35,0,1));ctx.stroke();}
  // screen fx
  ctx.setTransform(1,0,0,1,0,0);
  if(G.state==='play'&&G.raining&&n>.2)drawRain(n);
  ctx.globalAlpha=.55+G.fear*.45;ctx.drawImage(vign,0,0);ctx.globalAlpha=1;
  const low=G.state==='play'&&P.hp<35?(.25+.2*Math.sin(G.time*5))*(1-P.hp/35):0;
  const red=Math.max(G.dmg*.5,low);
  if(red>0){const g=ctx.createRadialGradient(cv.width/2,cv.height/2,Math.min(cv.width,cv.height)*.25,cv.width/2,cv.height/2,Math.hypot(cv.width,cv.height)*.55);g.addColorStop(0,'rgba(120,0,0,0)');g.addColorStop(1,`rgba(120,0,0,${red})`);ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);}
  ctx.save();ctx.globalAlpha=.55+G.fear*.6;ctx.fillStyle=grains[(G.time*24|0)%4];ctx.translate(Math.random()*192|0,Math.random()*192|0);ctx.fillRect(-192,-192,cv.width+192,cv.height+192);ctx.restore();
  if(G.state==='play'&&!touchMode&&!G.overlay){ctx.strokeStyle='rgba(214,205,182,.55)';ctx.lineWidth=1.2*DPR;ctx.beginPath();ctx.arc(mouse.x*DPR,mouse.y*DPR,5*DPR,0,TAU);ctx.stroke();ctx.fillStyle='rgba(214,205,182,.7)';ctx.fillRect(mouse.x*DPR-.75*DPR,mouse.y*DPR-.75*DPR,1.5*DPR,1.5*DPR);}
}
function drawRain(n){ctx.strokeStyle=`rgba(160,175,190,${.22*n})`;ctx.lineWidth=1*DPR;ctx.beginPath();
  for(const r of rain){r.y+=.022*r.s;r.x+=.004*r.s;if(r.y>1){r.y-=1;r.x=Math.random();}if(r.x>1)r.x-=1;const x=r.x*cv.width,y=r.y*cv.height;ctx.moveTo(x,y);ctx.lineTo(x+5*DPR,y+18*DPR*r.s);}ctx.stroke();}

// ================= MAP =================
function drawMap(){
  const c=$('mapc').getContext('2d'),S=520,sc=S/(WORLD*2),m=(x)=>(x+WORLD)*sc;
  c.setTransform(1,0,0,1,0,0);c.fillStyle='#c3b692';c.fillRect(0,0,S,S);
  c.fillStyle='rgba(120,90,50,.18)';for(let i=0;i<30;i++){c.beginPath();c.arc((i*97)%S,(i*173)%S,30+(i*37)%60,0,TAU);c.fill();}
  c.fillStyle='rgba(60,70,40,.55)';for(const o of obs){if(o.kind!=='tree')continue;const cx=Math.floor((o.x+WORLD)/97.5),cy=Math.floor((o.y+WORLD)/97.5);if(!explored[cy*40+cx])continue;c.beginPath();c.arc(m(o.x),m(o.y),Math.max(1.4,o.r*sc),0,TAU);c.fill();}
  c.strokeStyle='rgba(70,50,30,.75)';c.lineWidth=2.2;c.setLineDash([5,4]);for(const p of PATHS){c.beginPath();c.moveTo(m(p[0][0]),m(p[0][1]));for(let i=1;i<p.length;i++)c.lineTo(m(p[i][0]),m(p[i][1]));c.stroke();}c.setLineDash([]);
  c.fillStyle='#17140f';for(let y=0;y<40;y++)for(let x=0;x<40;x++)if(!explored[y*40+x])c.fillRect(x*13-.5,y*13-.5,14,14);
  c.fillStyle='#2b2117';c.fillRect(m(-150),m(-110),300*sc,220*sc);
  c.font='700 13px "Noto Serif TC",serif';c.textAlign='center';
  c.fillStyle='#2b2117';c.fillText('小屋',m(0),m(-150));
  for(const k in LM){const l=LM[k];if(!l.found)continue;const done=(k==='well'&&P.parts.tube)||(k==='car'&&P.parts.coil)||(k==='shrine'&&P.parts.antenna);
    c.fillStyle=done?'#6a5a40':'#7a1d15';c.beginPath();c.arc(m(l.x),m(l.y),4,0,TAU);c.fill();c.fillStyle='#2b2117';c.fillText(l.name,m(l.x),m(l.y)-9);}
  c.save();c.translate(m(P.x),m(P.y));c.rotate(P.aim);c.fillStyle='#9a231c';c.beginPath();c.moveTo(8,0);c.lineTo(-5,-5);c.lineTo(-3,0);c.lineTo(-5,5);c.closePath();c.fill();c.restore();
  c.font='400 12px "Noto Serif TC",serif';c.textAlign='left';c.fillStyle='rgba(43,33,23,.7)';c.fillText('老陳的地圖',14,S-16);
}

// ================= FLOW =================
function die(){G.state='dead';$('hud').hidden=true;$('touch').hidden=true;closeOv();sfx('stinger',null,null,1,.8);sfx('boom',null,null,1,.6);
  $('deadsub').textContent=`你在第${CN[G.day]||G.day}天${nightness(G.clock)>.5?'的夜裡':''}倒下了。撐過了 ${G.survived} 個夜晚，擊退了 ${G.kills} 個東西。`;
  setTimeout(()=>{$('dead').hidden=false;$('retryBtn').focus();},1200);}
function winGame(){G.state='win';$('hud').hidden=true;$('touch').hidden=true;closeOv();for(const e of enemies)e.dead=true;
  $('winsub').textContent=`遠處傳來引擎聲。你撐過了 ${G.survived+1} 個夜晚。至少這一次，林子放過了你。`;$('win').hidden=false;$('againBtn').focus();}
function startGame(){audioInit();if(AU.A.state==='suspended')AU.A.resume();resetGame();
  ['title','dead','win'].forEach(id=>$(id).hidden=true);$('hud').hidden=false;$('touch').hidden=!touchMode;$('log').innerHTML='';
  msg('你在小屋裡醒來。外面很安靜。');setTimeout(()=>msg('桌上有一張紙條。'),2600);sfx('creak',null,null,.5,.6);}
$('startBtn').onclick=startGame;$('retryBtn').onclick=startGame;$('againBtn').onclick=startGame;

// title backdrop
genWorld();Object.assign(P,{hp:100,battery:100,flash:true,flick:0,parts:{tube:false,coil:false,antenna:false}});G.genFuel=999;
let last=performance.now();
function frame(now){
  const raw=(now-last)/1000;const dt=Math.min(.05,raw);last=now;
  if(hasFilter&&raw<.2){perfAcc+=raw;perfN++;if(perfN>=90){if(perfAcc/perfN>.024)hasFilter=false;perfAcc=0;perfN=0;}}
  try{update(dt);render();if(G.state==='play'){updHUD();setHTML('prompt',G.overlay?'':focusLabel(focus));if(G.overlay==='mapov')drawMap();}}catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__kulin={G,P,INV,get enemies(){return enemies;},spawnEnemy};
})();
</script>
