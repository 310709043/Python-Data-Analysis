<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyVoca — AI Service Intelligence</title>
<style>
  :root {
    --bg: #07070b;
    --surface: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.09);
    --ink-100: #eeeef3;
    --ink-300: #9c9cb2;
    --brand: #ff6b00;
    --brand-light: #ffa76b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(ellipse 60% 45% at 15% -8%, rgba(255,107,0,0.16), transparent 60%),
      radial-gradient(ellipse 50% 40% at 100% 100%, rgba(255,138,56,0.09), transparent 55%),
      var(--bg);
    color: var(--ink-100);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap { max-width: 720px; width: 100%; text-align: center; }
  .mark { width: 84px; height: 84px; margin: 0 auto 28px; }
  h1 { font-size: clamp(30px, 5vw, 44px); font-weight: 800; letter-spacing: -0.02em; margin: 0 0 10px; }
  h1 .accent { color: var(--brand); }
  p.lede { color: var(--ink-300); font-size: 16px; line-height: 1.6; max-width: 46ch; margin: 0 auto 40px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 600px) { .cards { grid-template-columns: 1fr; } }
  a.card {
    display: block;
    text-align: left;
    padding: 24px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    text-decoration: none;
    color: var(--ink-100);
    transition: border-color 0.25s, transform 0.25s;
  }
  a.card:hover { border-color: rgba(255,107,0,0.4); transform: translateY(-2px); }
  a.card .tag {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--brand-light);
    border: 1px solid rgba(255,107,0,0.3); background: rgba(255,107,0,0.08);
    border-radius: 999px; padding: 3px 10px; margin-bottom: 12px;
  }
  a.card .title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  a.card .desc { font-size: 13.5px; color: var(--ink-300); line-height: 1.5; }
  .foot { margin-top: 40px; font-size: 12px; color: var(--ink-300); opacity: 0.7; }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <path d="M50 30 L69.02 43.82 L61.76 66.18 L38.24 66.18 L30.98 43.82 Z" fill="#FF7300" stroke="#0C0C12" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M50 30 L77.64 11.98 L69.02 43.82 Z" fill="#FFB600" stroke="#0C0C12" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M69.02 43.82 L94.7 64.52 L61.76 66.18 Z" fill="#FF7300" stroke="#0C0C12" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M61.76 66.18 L50 97 L38.24 66.18 Z" fill="#E4007F" stroke="#0C0C12" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M38.24 66.18 L5.3 64.52 L30.98 43.82 Z" fill="#8DC63F" stroke="#0C0C12" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M30.98 43.82 L22.36 11.98 L50 30 Z" fill="#5C4E9E" stroke="#0C0C12" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M22.36 11.98 A47 47 0 0 1 77.64 11.98 L50 30 Z" fill="#FF9E1B" stroke="#0C0C12" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M77.64 11.98 A47 47 0 0 1 94.7 64.52 L69.02 43.82 Z" fill="#FF6B00" stroke="#0C0C12" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M94.7 64.52 A47 47 0 0 1 50 97 L61.76 66.18 Z" fill="#F0417F" stroke="#0C0C12" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M50 97 A47 47 0 0 1 5.3 64.52 L38.24 66.18 Z" fill="#A6CE39" stroke="#0C0C12" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M5.3 64.52 A47 47 0 0 1 22.36 11.98 L30.98 43.82 Z" fill="#7C6BB5" stroke="#0C0C12" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
    <h1>MyVoca <span class="accent">AI Service Intelligence</span></h1>
    <p class="lede">MyClaw Enterprise AI Agent Platform · 台灣大哥大 Taiwan Mobile</p>
    <div class="cards">
      <a class="card" href="./prototype/">
        <span class="tag">互動 Demo</span>
        <div class="title">完整 Prototype →</div>
        <div class="desc">六大頁面可實際操作：AI Voice Demo、Whisper Copilot、Service Twin、Customer 360、營運儀表板</div>
      </a>
      <a class="card" href="./deck/">
        <span class="tag">上台簡報</span>
        <div class="title">3 分鐘簡報 →</div>
        <div class="desc">7 頁可翻頁演示，方向鍵換頁，按 N 顯示講稿提示</div>
      </a>
    </div>
    <div class="foot">Interactive prototype · mock data for demo purposes</div>
  </div>
</body>
</html>
